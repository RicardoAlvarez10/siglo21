<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D4A3E">
<meta name="color-scheme" content="light">
<title>Siglo 21 · Inicio</title>
<script>
/* =====================================================================
   CONFIGURACIÓN · lo único que hay que tocar cuando cambia el cuatrimestre
   ---------------------------------------------------------------------
   EN_CURSO: las materias del cuatrimestre actual, en el orden en que se
   muestran. Todas las demás de MATERIAS salen abajo, en "Aprobadas".
   Para una materia nueva: agregarla a MATERIAS con su página
   (publicar-github/materia-<clave>.html) y sumar la clave a EN_CURSO.
   Este archivo y publicar-github/index.html son el mismo: después de
   editarlo, copiarlo encima de index.html para que GitHub Pages lo tome.
   ===================================================================== */
const INICIO_CUATRIMESTRE = "05/10/2026";
const EN_CURSO = ["calculo", "tecnologia", "transferencia", "bienestar"];

const MATERIAS = {
  calculo:       { nombre: "Cálculo Avanzado",                          detalle: "4 módulos · Parciales 1 y 2" },
  tecnologia:    { nombre: "Tecnología, Humanidades y Modelos Globales", detalle: "4 módulos · Parciales 1 y 2" },
  transferencia: { nombre: "Transferencia e Innovación Tecnológica",     detalle: "4 módulos · Parciales 1 y 2" },
  bienestar:     { nombre: "Bienestar y Emociones Positivas",            detalle: "2 módulos · Trabajo Final" },
  ia:            { nombre: "Introducción a la Inteligencia Artificial",  detalle: "4 módulos · Parciales 1 y 2" },
  discreta:      { nombre: "Matemática Discreta",                        detalle: "4 módulos · Parciales 1 y 2" },
  aprender:      { nombre: "Aprender en el Siglo XXI",                   detalle: "4 módulos · Parciales 1 y 2" },
};
/* ===================================================================== */

if (location.protocol === "file:") document.documentElement.classList.add("local");
</script>
<style>
  :root{
    --texto:#1A1A1A; --titulo:#3D3D3D; --acento:#2D4A3E; --fondo:#FAF9F7;
    --panel:#FFFFFF; --borde:#E7E5E4; --tenue:#6B6B6B; --ambar:#7A5A22;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);
    font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.55}
  .wrap{max-width:760px;margin:0 auto;padding:34px 24px 70px}

  header{text-align:center;margin-bottom:30px}
  header h1{font-size:clamp(21px,5.6vw,29px);line-height:1.22;color:var(--titulo);margin:0 0 6px;font-weight:normal}
  header p{margin:0;color:var(--tenue);font-size:clamp(12.5px,3.2vw,14px);
    font-family:'Segoe UI',Helvetica,Arial,sans-serif}

  .seccion{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin:34px 0 12px}
  .seccion:first-of-type{margin-top:0}
  .seccion h2{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);font-weight:600;margin:0}
  .seccion span{font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--tenue)}

  .lista{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .lista a{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;
    background:var(--panel);border:1px solid var(--borde);border-radius:5px;padding:14px 18px;
    text-decoration:none;color:var(--texto);transition:border-color .15s ease,background .15s ease}
  .lista a:hover{border-color:var(--acento);background:#F3F6F4}
  .lista a:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
  .lista .txt{min-width:0}
  .lista b{display:block;font-weight:normal;font-size:17px;color:var(--titulo);line-height:1.3}
  .lista small{font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--tenue)}
  .lista .flecha{font-family:'Segoe UI',sans-serif;color:var(--acento);font-size:18px;flex-shrink:0}
  .en-curso a{border-left:3px solid var(--acento)}
  .aprobadas b{color:var(--tenue)}

  footer{margin-top:34px;font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--tenue);
    border-top:1px solid var(--borde);padding-top:14px}

  html:not(.local) .solo-local{display:none}

  @media (max-width:640px){
    .wrap{padding:20px 16px 56px}
    header{text-align:left;margin-bottom:24px}
    .lista a{padding:13px 15px}
    .lista b{font-size:16px}
    .seccion{margin:26px 0 10px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Universidad Siglo 21</h1>
  <p>Licenciatura en Inteligencia Artificial y Robótica<span class="solo-local"> · Ricardo Alvarez</span></p>
</header>

<div class="seccion"><h2>En curso</h2><span id="desde"></span></div>
<ul class="lista en-curso" id="en-curso"></ul>

<div class="seccion"><h2>Aprobadas</h2></div>
<ul class="lista aprobadas" id="aprobadas"></ul>

<footer>
  Cada materia abre su página con las autoevaluaciones, los módulos, los mapas conceptuales y el material de estudio.
</footer>
</div>

<script>
/* Las páginas de materia viven en publicar-github. Desde la carpeta raíz (este archivo
   abierto local) se entra a esa carpeta; desde index.html o GitHub Pages, ya se está en ella. */
const BASE = (location.protocol === "file:" && !/\/publicar-github\//.test(location.pathname)) ? "publicar-github/" : "";

function item(clave) {
  const m = MATERIAS[clave];
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = BASE + "materia-" + clave + ".html";
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML = '<span class="txt"><b></b><small></small></span><span class="flecha" aria-hidden="true">→</span>';
  a.querySelector("b").textContent = m.nombre;
  a.querySelector("small").textContent = m.detalle;
  li.appendChild(a);
  return li;
}

const enCurso = EN_CURSO.filter(c => MATERIAS[c]);
enCurso.forEach(c => document.getElementById("en-curso").appendChild(item(c)));
Object.keys(MATERIAS).filter(c => !enCurso.includes(c))
  .forEach(c => document.getElementById("aprobadas").appendChild(item(c)));
document.getElementById("desde").textContent = "desde el " + INICIO_CUATRIMESTRE;
</script>
</body>
</html>
