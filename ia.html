1:`<p>Los cuatro enfoques salen de cruzar dos ejes. El eje horizontal define qué se toma como vara: el <b>comportamiento humano</b>, que es ciencia empírica y requiere hipótesis y confirmación experimental, o la <b>racionalidad</b>, que es matemáticas e ingeniería y define sistemas que deciden de forma óptima. Un sistema es racional si hace lo correcto según su conocimiento, se parezca o no al humano. El eje vertical define qué se modela: procesos mentales o conductas.</p>
<table><tr><th></th><th>Comportamiento humano</th><th>Racionalidad</th></tr>
<tr><th>Procesos mentales</th><td>Sistemas que piensan como humanos</td><td>Sistemas que piensan racionalmente</td></tr>
<tr><th>Conductas</th><td>Sistemas que actúan como humanos</td><td>Sistemas que actúan racionalmente</td></tr></table>
<ul>
<li><b>Piensan como humanos.</b> Requiere entender primero cómo funciona la mente, por introspección y por experimentos psicológicos. La disciplina que combina modelos computacionales con técnicas experimentales de psicología es la <b>ciencia cognitiva</b>. Ejemplos: reconocimiento de voz, reconocimiento facial con redes convolucionales.</li>
<li><b>Actúan como humanos.</b> Vinculado al Test de Turing. Importa que el comportamiento externo resulte indistinguible del humano ante un observador. Ejemplos: robots asistentes domésticos, chatbots, asistentes virtuales avanzados, creatividad computacional con GAN.</li>
<li><b>Piensan racionalmente.</b> Raíz en la lógica formal de Aristóteles. Hacia 1965 ya había programas que describían un problema en notación lógica y lo resolvían si la solución existía. Dos obstáculos distintos: traducir conocimiento informal a notación formal, y la distancia entre resolver en teoría y resolver eficientemente en la práctica. Ejemplos: motores de búsqueda, sistemas expertos médicos, reglas si-entonces, planificación automática.</li>
<li><b>Actúan racionalmente.</b> El más general y el mejor alineado con el avance científico. Ejemplos: programas de ajedrez, recomendación en plataformas de streaming, asistentes virtuales resolviendo una tarea concreta.</li>
</ul>
<p>En el caso AlphaGo la cátedra lo ubica en los cuatro cuadrantes a la vez, para mostrar que un sistema real no entra en una sola casilla.</p>`,

2:`<p>Los tres paradigmas se diferencian por <b>cómo se representa el conocimiento</b>.</p>
<table><tr><th></th><th>Simbólica (clásica)</th><th>Subsimbólica</th><th>Híbrida (neuro-simbólica)</th></tr>
<tr><th>Base</th><td>Manipulación de símbolos y reglas explícitas</td><td>Aprendizaje a partir de datos</td><td>Combinación de ambas</td></tr>
<tr><th>Representación</th><td>Explícita: bases estructuradas, reglas lógicas, procedimientos</td><td>Opaca, codificada en los parámetros del modelo</td><td>Explícita e implícita a la vez</td></tr>
<tr><th>Fortaleza</th><td>Transparencia, razonamiento auditable paso a paso</td><td>Generalización y adaptación sin reprogramar</td><td>Potencia con interpretabilidad</td></tr>
<tr><th>Debilidad</th><td>Ambigüedad, excepciones, situaciones no previstas</td><td>Interpretabilidad y transparencia</td><td></td></tr>
<tr><th>Época</th><td>Dominó las primeras décadas</td><td>Nace en los años 50, se impone en las últimas décadas</td><td>Lo más reciente</td></tr></table>
<p><b>Aplicaciones por paradigma.</b> Simbólica: sistemas expertos con reglas if-then, planificación automatizada, razonamiento lógico, representación del conocimiento, búsqueda heurística. Subsimbólica: redes neuronales y conexionismo, aprendizaje profundo (CNN, RNN, LSTM, GAN, Transformer), PLN moderno (BERT, GPT), visión por computadora, machine learning con excepciones híbridas. Híbrida: robótica avanzada, sistemas conversacionales, agentes inteligentes, razonamiento con incertidumbre.</p>
<p>El <b>conexionismo</b>, que la cátedra ubica dentro de la subsimbólica, propone que la inteligencia emerge de la interconexión masiva de unidades simples de procesamiento, análogas a neuronas. Surgió como alternativa a los modelos simbólicos.</p>`,

3:`<table><tr><th></th><th>Comportamiento humano</th><th>Racionalidad</th></tr>
<tr><th>Procesos mentales</th><td>Piensan como humanos · ciencia cognitiva</td><td>Piensan racionalmente · lógica de Aristóteles</td></tr>
<tr><th>Conductas</th><td>Actúan como humanos · <b>Test de Turing</b></td><td>Actúan racionalmente · agentes racionales</td></tr></table>
<p>El corte no está en el resultado sino en si se modela el proceso mental o solo la conducta observable. El Test de Turing no mira el proceso interno: mira si el comportamiento externo resulta indistinguible del humano ante un observador.</p>
<p><b>Las cuatro capacidades que hacen falta para superar el Test de Turing</b>, del módulo 02: procesamiento del lenguaje natural para comunicarse con fluidez, representación del conocimiento para almacenar información, conceptos y emociones simuladas, razonamiento automático para responder preguntas complejas, y aprendizaje automático para adaptarse a nuevas circunstancias. El caso de fracaso es <b>Tay</b>, el chatbot que Microsoft lanzó en Twitter en 2016 y que en menos de 24 horas publicaba mensajes ofensivos.</p>
<p>Pregunta de repaso que trae el propio PDF, ya con la respuesta: los sistemas que actúan como humanos buscan imitar el comportamiento humano sin necesariamente replicar los procesos mentales internos. <b>Verdadero.</b></p>`,

4:`<p><b>Los cinco atributos que distinguen a un agente de un programa convencional:</b></p>
<ol><li>Control autónomo</li><li>Percepción del entorno</li><li>Persistencia durante períodos prolongados</li><li>Adaptación a los cambios</li><li>Capacidad para alcanzar objetivos diferentes</li></ol>
<p>Aparecen dentro del enfoque de sistemas que actúan racionalmente, donde Russell y Norvig definen la IA como el estudio y construcción de agentes racionales. Estos cinco atributos son los que el módulo 02 desarrolla después con PEAS.</p>
<p>La autoconciencia no está en la lista porque pertenece a la <b>IA fuerte</b>:</p>
<table><tr><th></th><th>IA débil</th><th>IA fuerte</th></tr>
<tr><th>Qué es</th><td>Sistemas para funciones específicas, sin comprensión real de lo que hacen</td><td>Concepción teórica de máquinas con comprensión, razonamiento y autoconciencia genuinos</td></tr>
<tr><th>Estado</th><td>Realidad práctica, con aplicaciones funcionando hoy</td><td>Horizonte distante de investigación y debate filosófico</td></tr>

5:`<p>La definición textual de la cátedra, que conviene poder reproducir:</p>
<blockquote>El conjunto de estrategias, tecnologías y sistemas para el almacenamiento, procesamiento, análisis y visualización de conjuntos de datos complejos, que por su volumen, velocidad o variedad no pueden ser tratados de forma eficiente en un sistema tradicional de análisis (Casas Roma et al., 2019).</blockquote>
<p>Dos cosas de esa formulación. Se apoya en una <b>incapacidad de los sistemas tradicionales</b> y no en una cifra. Y enumera <b>cuatro verbos</b>: almacenar, procesar, analizar y visualizar. La visualización es la que se olvida al repetirla de memoria.</p>
<p>Reducir el big data al volumen aparece desmentido tres veces en la lección: en la introducción, en la sección de volumen y en la actividad de repaso. Esa repetición suele anticipar la pregunta.</p>`,

6:`<p><b>La taxonomía de la variedad, que es lo más preguntable de esa V:</b></p>
<table><tr><th>Tipo de dato</th><th>Qué incluye</th></tr>
<tr><td>Estructurado</td><td>Bases relacionales con esquema predefinido, hojas de cálculo, ERP y CRM, lecturas de sensores IoT estandarizadas</td></tr>
<tr><td>Semiestructurado</td><td>XML, JSON, logs, <b>correos electrónicos con campos definidos y cuerpo libre</b>, HTML</td></tr>
<tr><td>No estructurado</td><td>Imágenes, video, audio, publicaciones en redes sociales, documentos de texto</td></tr></table>
<p>La solución que la cátedra asocia al desafío de variedad son las plataformas <b>data lakes</b>. El término lakehouse no existe en el material.</p>`,

7:`<p><b>Las cinco V.</b> Doug Laney, analista de META Group, formula las tres V en <em class="dato">2001</em>: volumen, velocidad y variedad. Veracidad y valor se agregan más tarde. Las tres originales apuntan a desafíos técnicos, las dos agregadas a lo cualitativo.</p>
<table><tr><th>V</th><th>Definición corta</th><th>Contenido evaluable</th></tr>
<tr><td>Volumen</td><td>Cantidad de datos, en petabytes o exabytes</td><td>No todos los datos son útiles. Hadoop, almacenamiento distribuido, NoSQL, escalado horizontal</td></tr>
<tr><td>Variedad</td><td>Diversidad de fuentes y formatos</td><td>La taxonomía de tres tipos</td></tr>
<tr><td>Velocidad</td><td>Rapidez de generación y procesamiento en ventanas cortas</td><td>Cuatro modos: tiempo real, por lotes programados, flujo continuo, híbrido</td></tr>
<tr><td>Veracidad</td><td>Calidad y confiabilidad del dato</td><td>Cinco formas de ausencia: inexactitud, duplicados, información incompleta, inconsistencias internas, valores atípicos no representativos</td></tr>
<tr><td>Valor</td><td>Transformar datos brutos en conocimiento accionable</td><td>Cinco tipos de análisis: descriptivo, predictivo, prescriptivo, simulación, visualización</td></tr></table>
<p><b>Democratización del acceso a los datos.</b> Es un tema propio, no una subsección de las cinco V. Consiste en que cualquier persona de la organización pueda acceder, comprender y usar datos relevantes para su trabajo, sin importar su formación técnica ni su jerarquía. Surge como respuesta a los <b>silos de información</b>, y el cierre de la cátedra es explícito: democratizar no es un problema de tecnología sino un cambio cultural.</p>`,

8:`<p><b>Los tres tipos de aprendizaje automático:</b></p>
<table><tr><th></th><th>Supervisado</th><th>No supervisado</th><th>Por refuerzo</th></tr>
<tr><th>Datos</th><td>Etiquetados, cada ejemplo tiene entrada y salida asociada</td><td>Sin etiquetas ni categorías predefinidas</td><td>No hay conjunto previo, el agente interactúa con el entorno</td></tr>
<tr><th>Objetivo</th><td>Predecir la etiqueta correcta para datos nuevos</td><td>Descubrir patrones, estructuras y relaciones inherentes</td><td>Maximizar la recompensa acumulada en el tiempo</td></tr>
<tr><th>Tareas</th><td>Clasificación, que predice una categoría discreta, y regresión, que predice un valor continuo</td><td>Agrupamiento, detección de anomalías, reducción de dimensionalidad</td><td>Aprendizaje de comportamientos óptimos por exploración y explotación</td></tr>
<tr><th>Algoritmos</th><td>Vecinos más cercanos, SVM, árboles y bosques aleatorios, regresión logística, Naive Bayes, redes neuronales, regresión lineal y polinómica</td><td>K-Means, DBSCAN, análisis jerárquico, One-class SVM, PCA y Kernel PCA</td><td>Q-Learning, Deep Q-Networks, Policy Gradient Methods</td></tr>
<tr><th>Ejemplo de la cátedra</th><td>Filtro de correo no deseado, precio de un automóvil</td><td><b>Asociación de productos en supermercado</b></td><td>Robótica, videojuegos, recomendación</td></tr></table>
<p>Las características de entrada que se usan para predecir se llaman <b>predictores</b>. En el refuerzo la recompensa puede ser inmediata o diferida, y por eso no equivale a una etiqueta.</p>`,

9:`<p>Una red tiene <b>tres tipos de capa</b>: la de entrada recibe los datos, las <b>ocultas</b> procesan mediante transformaciones matemáticas, y la de salida entrega el resultado. El término aprendizaje profundo surge cuando hay <b>múltiples capas ocultas</b>. Cada neurona combina las señales ponderadas de la capa anterior aplicando una <b>función de activación</b> como ReLU, sigmoide o tangente hiperbólica. La fuerza de las conexiones son los <b>pesos</b>, que se ajustan por <b>retropropagación del error</b>.</p>
<table><tr><th>Dimensión</th><th>Red neuronal tradicional</th><th>Deep learning</th></tr>
<tr><td>Profundidad</td><td>Rara vez supera tres o cuatro capas</td><td>Decenas, centenares o miles de capas ocultas</td></tr>
<tr><td>Preprocesamiento</td><td>Requiere ingeniería manual de características</td><td>Procesa datos en su forma natural, aprendizaje de extremo a extremo</td></tr>
<tr><td>Escalabilidad</td><td>El rendimiento se estabiliza rápido</td><td>Sigue mejorando con más datos y más cómputo</td></tr>
<tr><td>Innovaciones propias</td><td>Fundamentos matemáticos comunes</td><td>ReLU, dropout, normalización por lotes, CNN, RNN, Transformers, Adam, RMSprop</td></tr>
<tr><td>Hardware</td><td>Equipos convencionales</td><td>GPU o TPU para cálculo masivamente paralelo</td></tr></table>
<p><b>La jerarquía de representaciones</b>, que reaparece en la lección 4 y ya fue evaluada: primeras capas con bordes y texturas simples, capas intermedias con formas y patrones compuestos, capas superiores con objetos completos o escenas. El distractor de esa pregunta fue la misma frase con el orden invertido.</p>`,

10:`<p>La <b>IA generativa</b> crea contenido nuevo, original y coherente. La IA tradicional clasifica, identifica patrones y decide sobre datos existentes. El punto de inflexión que marca la cátedra es <b>ChatGPT, a fines de 2022</b>.</p>
<p>La aclaración que el PDF pone en recuadro aparte, y que es material de trampa: los Transformers son la tecnología habilitadora de los avances en generación de lenguaje, <b>pero no la única aproximación</b> a sistemas generativos.</p>
<p>Es uno de los cuatro puntos que la cátedra desmiente más de una vez. Los otros tres: reducir el big data al volumen, que las reglas del sistema experto las codifican humanos, y que los actuadores cierran el ciclo del agente.</p>
<p>Otras aproximaciones generativas que el material nombra en visión artificial: <b>GAN</b> y transferencia de estilo neuronal para creación de imágenes.</p>`,

11:`<p><b>Línea de tiempo de las redes neuronales:</b></p>
<table><tr><th>Año</th><th>Hito</th><th>Autores</th></tr>
<tr><td>1943</td><td>Primeros modelos conceptuales de neurona artificial</td><td>McCulloch y Pitts</td></tr>
<tr><td><b>1958</b></td><td><b>El perceptrón</b></td><td><b>Rosenblatt</b></td></tr>
<tr><td>Década de 1980</td><td>Algoritmo de retropropagación</td><td>Rumelhart, Hinton y Williams</td></tr>
<tr><td>Década de 2010</td><td>Salto al deep learning</td><td></td></tr></table>
<p>El salto de 2010 se apoya en tres factores convergentes: conjuntos de datos masivos, incremento exponencial de capacidad computacional, y avances algorítmicos que permitieron entrenar redes de múltiples capas de forma eficiente.</p>
<p>Dos precisiones que vienen del módulo 02. El perceptrón de Rosenblatt es <b>conexionista</b>, reconoce patrones simples aprendiendo de ejemplos, y tomarlo por un sistema simbólico es un distractor fijo. Y el perceptrón de 1958 es <b>anterior</b> al programa de damas de Samuel de 1959, aunque el texto los presenta al revés.</p>`,

12:`<p><b>Las tres tareas de la visión por computadora con su arquitectura:</b></p>
<table><tr><th>Tarea</th><th>Qué hace</th><th>Arquitecturas</th></tr>
<tr><td>Clasificación de imágenes</td><td>Asigna la imagen a <b>categorías predefinidas</b>. Un único objeto por imagen</td><td>CNN</td></tr>
<tr><td>Detección y localización</td><td>Reconoce <b>múltiples objetos y sus ubicaciones</b> dividiendo la imagen en regiones</td><td>YOLO, SSD, Faster R-CNN</td></tr>
<tr><td>Creación de imágenes</td><td>Genera contenido visual nuevo</td><td>GAN y transferencia de estilo neuronal</td></tr></table>
<p>El <b>pipeline del sistema de visión</b> tiene cuatro etapas: datos de entrada, preprocesamiento con estandarización de dimensiones, escala de grises y aumento de datos, extracción de características, y modelo de aprendizaje automático.</p>
<p>Dos distinciones vecinas que la cátedra evalúa. Ajustar brillo, contraste y filtros es <b>procesamiento de imágenes</b>, una operación de bajo nivel; interpretar el significado y el contexto es <b>visión por computadora</b>. Y capturar datos visuales es <b>visión</b>; darles sentido en un marco contextual es <b>percepción visual</b>, como el vehículo autónomo que no solo detecta al peatón sino que interpreta su velocidad, su dirección y sus intenciones.</p>
<p>Errata del material: en M01 L4 la Figura 3 está titulada Clasificación de imágenes pero describe detección de objetos, con recuadros sobre personas, automóviles y bicicletas. Molesta porque es justamente la distinción que se evalúa.</p>`,

13:`<p>La imagen es una <b>matriz bidimensional de píxeles</b>. En escala de grises hay un valor por píxel de 0 a 255:</p>
<table><tr><th>Valor</th><th>Color</th></tr>
<tr><td>0</td><td>Negro absoluto</td></tr>
<tr><td>128</td><td>Gris medio</td></tr>
<tr><td>255</td><td>Blanco puro</td></tr></table>
<p>En <b>RGB</b> hay tres valores por píxel: (255,0,0) rojo, (0,0,255) azul, (255,255,255) blanco, (0,0,0) negro. Otros espacios que nombra la cátedra: <b>CMYK</b> para impresión, <b>HSV</b> con matiz, saturación y valor, y <b>YCbCr</b> de video digital.</p>
<p>La escala de grises aparece además como paso del <b>preprocesamiento</b>, la segunda etapa del pipeline, junto con la estandarización de dimensiones y el aumento de datos.</p>
<p>La <b>extracción de características</b> identifica bordes y contornos, texturas, distribuciones de color, y esquinas o puntos de interés. Sirve para reducir dimensionalidad, enfocar el sistema en lo relevante y crear representaciones resistentes a cambios de iluminación o perspectiva.</p>`,

14:`<p><b>Los dos modos de reconocimiento facial:</b></p>
<table><tr><th>Identificación facial</th><th>Verificación facial</th></tr>
<tr><td>Compara con <b>muchas</b> imágenes</td><td>Compara con <b>una sola</b> imagen</td></tr>
<tr><td>Responde quién es esta persona</td><td>Responde si es quien dice ser</td></tr>
<tr><td>Investigaciones y vigilancia</td><td>Autenticación y control de acceso</td></tr>
<tr><td><b>Mayor</b> complejidad computacional</td><td><b>Menor</b> complejidad computacional</td></tr></table>
<p>La precisión del reconocimiento facial por aprendizaje profundo que escribe la cátedra es <b>superior al 99 por ciento</b>.</p>
<p>Hueco declarado del material: los dos modos de reconocimiento facial figuran en M01 L4 como título sin texto desarrollado. La tabla de arriba es la reconstrucción del paquete de estudio.</p>`,

15:`<p>En la <b>clasificación tradicional</b> se usan SVM y AdaBoost, con extracción de características y clasificación <b>separadas</b>. En <b>aprendizaje profundo</b> la clasificación ocurre en las últimas capas, en un esquema de <b>aprendizaje de extremo a extremo</b> donde las dos etapas se optimizan en conjunto.</p>
<p>La extracción <b>manual</b> de características corresponde al aprendizaje automático tradicional y la <b>automática</b> al profundo. Es la misma distinción que la tabla de red tradicional contra red profunda llama preprocesamiento.</p>
<p>Las arquitecturas actuales agregan dos cosas: <b>mecanismos de atención</b>, que enfocan la red en las regiones relevantes, y <b>transferencia de aprendizaje</b>, que adapta modelos preentrenados con pocos ejemplos.</p>
<p>El PDF marca de forma expresa que <b>las GAN no pertenecen a la etapa de clasificación</b>.</p>
<p>En el flujo de clasificación, el <b>aplanamiento</b> convierte las características espaciales en datos utilizables para decidir, y la capa de salida entrega las clases con su nivel de confianza.</p>`,

16:`<p><b>Los tres autores de la línea lógica, en orden:</b></p>
<table><tr><th>Autor</th><th>Disciplina</th><th>Aporte</th></tr>
<tr><td>Aristóteles</td><td>Filosofía</td><td>Primer sistema formal de lógica con los silogismos. Introduce la separación entre forma y contenido: todos los A son B, C es A, por lo tanto C es B</td></tr>
<tr><td>Boole</td><td>Matemáticas</td><td><b>Álgebra proposicional.</b> AND es conjunción y equivale a multiplicación, OR es disyunción y equivale a una forma de adición, NOT es negación y equivale al complemento</td></tr>
<tr><td><b>Frege</b></td><td>Matemáticas</td><td><b>Lógica de predicados o de primer orden.</b> Distingue objetos de predicados e introduce <b>variables, cuantificadores y funciones</b>. El símbolo para todo es el cuantificador universal, existe al menos un es el existencial</td></tr></table>
<p>El silogismo formalizado por Frege, tal como lo trae el material:</p>
<blockquote>Para todo x, si Humano(x) entonces Mortal(x)<br>Humano(Sócrates)<br>Por lo tanto, Mortal(Sócrates)</blockquote>
<p>Church aparece en la misma disciplina pero por otro aporte: el <b>cálculo lambda</b>, en paralelo a Turing, cuya equivalencia es la tesis de Church-Turing. Se centra en funciones y su aplicación en vez de máquinas y estados.</p>`,

17:`<p><b>El problema de la parada</b> se plantea así: se busca un programa verificador que, dado cualquier otro programa y sus datos de entrada, determine con certeza si terminará o quedará en bucle infinito. Turing demuestra <b>por contradicción</b> que es imposible. Aparece en <em class="dato">On Computable Numbers</em>, 1936, junto con la máquina de Turing.</p>
<p><b>Las tres consecuencias:</b></p>
<ol>
<li>Hay propiedades de los programas indeterminables por análisis automático.</li>
<li>Existen problemas bien definidos sin garantía de solución algorítmica.</li>
<li>Ningún sistema de IA supera esa barrera.</li>
</ol>
<p>Es el <b>primer problema probado formalmente como no computable</b>. La cátedra lo separa de forma expresa de un problema meramente difícil o costoso: no es una cuestión de tiempo de cómputo.</p>`,

18:`<p><b>Herbert Simon</b>, dentro de los fundamentos de <b>economía</b>. La racionalidad limitada consiste en buscar soluciones lo suficientemente buenas en lugar de óptimas, por límites cognitivos y computacionales. Es criterio de diseño, no limitación de hardware, y atraviesa desde la planificación heurística hasta el aprendizaje profundo.</p>
<p>Los otros dos aportes de economía: <b>Von Neumann y Morgenstern</b> con la teoría de juegos, que incluye equilibrio de Nash, estrategias dominantes, juegos de suma cero y estrategia mixta, que consiste en ser deliberadamente impredecible. Y <b>Bellman</b> con la programación dinámica y los procesos de decisión de Markov, donde el valor de un estado es la recompensa inmediata más el valor descontado de los estados futuros, base del aprendizaje por refuerzo.</p>
<p><b>Los ocho fundamentos disciplinarios, en el orden de la cátedra:</b> filosofía, matemáticas, economía, neurociencia, psicología, ingeniería informática, teoría de control y cibernética, y lingüística. La filosofía aporta la pregunta y la forma lógica, las matemáticas el lenguaje formal, la economía el criterio de decisión, la neurociencia y la psicología el modelo de referencia, la ingeniería el sustrato material, el control el mecanismo de retroalimentación y la lingüística el dominio del lenguaje.</p>
<p>No confundir con el <b>límite de la memoria de trabajo de Miller</b>, alrededor de siete elementos, que viene de psicología y de la revolución cognitiva de 1950.</p>`,

19:`<p><b>Los aportes de neurociencia, en orden histórico:</b></p>
<table><tr><th>Autor</th><th>Aporte</th></tr>
<tr><td>Broca y Wernicke</td><td>Áreas cerebrales ligadas al lenguaje, siglo XIX. Demuestran que funciones cognitivas complejas se localizan en regiones concretas</td></tr>
<tr><td>Ramón y Cajal</td><td>El cerebro está compuesto por células distintas, las neuronas, que forman redes interconectadas</td></tr>
<tr><td><b>McCulloch y Pitts</b></td><td><b>1943</b>, modelo matemático de neurona artificial capaz de operaciones lógicas básicas. McCulloch era <b>neurofisiólogo</b> y Pitts <b>matemático autodidacta</b></td></tr></table>
<p>Los otros dos nombres del ítem cubren otras fechas de la misma línea de tiempo: <b>Rosenblatt</b> es el perceptrón de 1958, y <b>Rumelhart, Hinton y Williams</b> son la retropropagación de 1986, que resuelve el entrenamiento de redes multicapa y reactiva el conexionismo.</p>`,

20:`<p><b>Las nueve etapas de la historia de la IA:</b></p>
<table><tr><th>Etapa</th><th>Período</th><th>Marca distintiva</th></tr>
<tr><td>Antecedentes</td><td>1936-1950</td><td>Bases teóricas y primer hardware</td></tr>
<tr><td><b>Nacimiento de la IA</b></td><td><b>1950-1960</b></td><td><b>Test de Turing y conferencia de Dartmouth</b></td></tr>
<tr><td>Era del entusiasmo</td><td>1960-1974</td><td>Sistemas expertos iniciales y financiamiento abundante</td></tr>
<tr><td>Primer invierno</td><td>1974-1980</td><td>Informe Lighthill y recortes</td></tr>
<tr><td>Era de los sistemas expertos</td><td>1980-1987</td><td>IA rentable y retropropagación</td></tr>
<tr><td>Segundo invierno</td><td>1987-1993</td><td>Caída de los sistemas expertos</td></tr>
<tr><td>Recuperación silenciosa</td><td>1993-2011</td><td>Enfoque pragmático, Deep Blue y Watson</td></tr>
<tr><td>Revolución del aprendizaje profundo</td><td>2012-2019</td><td>AlexNet, AlphaGo, BERT</td></tr>
<tr><td>Era de la IA generativa</td><td>2020 en adelante</td><td>GPT-3, AlphaFold 2, difusión de imágenes</td></tr></table>
<p><b>Los años que rodean la pregunta, con el detalle evaluable de cada uno:</b></p>
<table><tr><th>Año</th><th>Hito</th><th>Detalle</th></tr>
<tr><td>1936</td><td>On Computable Numbers, Turing</td><td>Máquina de Turing</td></tr>
<tr><td>1941</td><td>Z3 de Konrad Zuse</td><td>Diseñada para ingeniería aeronáutica. Se reprograma sin reconfiguración física</td></tr>
<tr><td>1943</td><td>Neurona artificial de McCulloch y Pitts</td><td>McCulloch era neurofisiólogo y Pitts matemático autodidacta</td></tr>
<tr><td>1945</td><td>ENIAC, Universidad de Pensilvania</td><td>Según esta lección, 167 metros cuadrados y 27 toneladas</td></tr>
<tr><td>1950</td><td>Turing publica en la revista Mind</td><td>Computing Machinery and Intelligence, con la pregunta: ¿pueden pensar las máquinas?</td></tr>
<tr><td><b>1956</b></td><td><b>Conferencia de Dartmouth</b></td><td><b>Nacimiento formal. La organiza John McCarthy, que acuña el término. Asisten Minsky, Shannon, Newell y Simon</b></td></tr>
<tr><td>1958</td><td>Perceptrón de Frank Rosenblatt</td><td>Conexionista, reconoce patrones simples aprendiendo de ejemplos</td></tr>
<tr><td>1959</td><td>Programa de damas de Arthur Samuel en IBM</td><td>Simbólico. Introduce el concepto de machine learning</td></tr>
<tr><td>1961</td><td>SAINT, de James Slagle en el MIT</td><td>Resuelve problemas de integración de nivel universitario</td></tr>
<tr><td>1964</td><td>DENDRAL, Feigenbaum y Lederberg en Stanford</td><td>Identifica estructuras químicas orgánicas. Uno de los primeros sistemas expertos</td></tr>
<tr><td>1966</td><td>ELIZA, Weizenbaum en el MIT</td><td>Simula un psicoterapeuta. Ejemplo del efecto de atribución: los usuarios le adjudicaban una comprensión que no tenía</td></tr></table>
<p>El par 1950 contra 1956 es el más usado de la lección. Turing publica el test en 1950, pero el <b>nacimiento formal de la disciplina</b> es Dartmouth en 1956. El término inteligencia artificial lo acuña <b>McCarthy</b>, no Turing.</p>
<p><b>Las dos corrientes que arrancan ahí.</b> La IA simbólica manipula símbolos y reglas lógicas, obtiene el conocimiento por programación explícita y fue el enfoque dominante. El conexionismo usa modelos inspirados en el cerebro, aprende de ejemplos y arrancó como minoritario.</p>`,

21:`<p><b>El tramo completo del primer invierno y su salida:</b></p>
<table><tr><th>Año</th><th>Hito</th><th>Detalle</th></tr>
<tr><td><b>1969</b></td><td><b>Perceptrons, Minsky y Papert</b></td><td><b>Demuestran que los perceptrones de una sola capa no resuelven problemas no linealmente separables, con la función XOR como caso</b></td></tr>
<tr><td>1973</td><td>Informe Lighthill</td><td>Encargado por el gobierno británico al físico sir James Lighthill. Habla de juguetes intelectuales</td></tr>
<tr><td>1982</td><td>Proyecto japonés de quinta generación</td><td>Diez años y 850 millones de dólares. La reacción estadounidense forma el MCC</td></tr>
<tr><td><b>1986</b></td><td><b>Retropropagación, Rumelhart, Hinton y Williams</b></td><td><b>Resuelve el entrenamiento de redes multicapa y reactiva el conexionismo</b></td></tr></table>
<p>La afirmación del ítem borra la condición <b>de una sola capa</b> y convierte un resultado acotado en una imposibilidad general. Ese borrado es el mecanismo del distractor.</p>
<p><b>Las tres causas del primer invierno:</b> subestimación de la complejidad de tareas que los humanos hacen de forma intuitiva, limitaciones computacionales severas, y diseño para <b>micromundos</b>, entornos simplificados que no capturaban la ambigüedad real.</p>
<p><b>Las tres limitaciones que explican el segundo invierno</b>, 1987 a 1993, esta vez por el fracaso de los sistemas expertos: costo de desarrollo altísimo, con meses o años de entrevistas a expertos; falta de flexibilidad fuera de dominios muy específicos; y mantenimiento problemático, porque las reglas nuevas generaban conflictos con las existentes.</p>`,

22:`<p><b>Los tres factores del éxito de AlexNet</b>, que es la respuesta más preguntable de la lección: avances algorítmicos en el diseño de redes, en particular las unidades rectificadoras lineales <b>ReLU</b>; uso de <b>GPU</b> originalmente diseñadas para videojuegos; y disponibilidad de <b>grandes conjuntos de datos etiquetados</b> como ImageNet.</p>
<p>El resultado con cifra: en 2012 AlexNet baja el error de ImageNet del <b>25 por ciento al 15,4 por ciento</b>.</p>
<p><b>El tramo posterior, para no cruzar fechas:</b></p>
<table><tr><th>Año</th><th>Hito</th><th>Detalle</th></tr>
<tr><td>1997</td><td>Deep Blue derrota a Kasparov</td><td>Usaba principalmente fuerza bruta, millones de posiciones por segundo</td></tr>
<tr><td>2004</td><td>Primer desafío DARPA de vehículos autónomos</td><td>240 km en el desierto de Mojave, ningún vehículo lo completó. En 2005 lo logra Stanford</td></tr>
<tr><td>2011</td><td>Watson gana Jeopardy!</td><td>Lenguaje natural, base de conocimiento enorme, respuestas con nivel de confianza</td></tr>
<tr><td><b>2012</b></td><td><b>AlexNet en ImageNet</b></td><td><b>Error del 25 % al 15,4 %</b></td></tr>
<tr><td>2016</td><td>AlphaGo derrota a Lee Sedol</td><td>Combina aprendizaje supervisado de partidas humanas con refuerzo jugando contra sí mismo</td></tr>
<tr><td>2017 y 2018</td><td>Transformer y BERT, de Google</td><td>BERT aporta comprensión de lenguaje con contexto bidireccional</td></tr>
<tr><td>Mayo 2020</td><td>GPT-3 de OpenAI</td><td>175 mil millones de parámetros. Muestra capacidades emergentes, no programadas ni previstas</td></tr>
<tr><td>Noviembre 2022</td><td>Interfaz conversacional sobre GPT-3.5</td><td>100 millones de usuarios en dos meses</td></tr></table>
<p>Deep Blue y Watson son los dos de IBM y se confunden entre sí: Deep Blue es ajedrez, 1997, fuerza bruta; Watson es Jeopardy!, 2011, lenguaje natural.</p>`,

23:`<p>La definición que hay que poder reproducir:</p>
<blockquote>El espacio de estados representa la totalidad de configuraciones o situaciones posibles que un sistema puede adoptar durante el proceso de resolución de problemas.</blockquote>
<p>Se materializa mediante <b>grafos</b>, donde cada <b>nodo</b> es un estado y cada <b>arista</b> una transición producida por un operador.</p>
<p><b>Los cinco componentes, con la numeración del PDF:</b></p>
<ol>
<li><b>Estados individuales.</b> Cada estado captura una foto del sistema en un momento, con todas las variables relevantes.</li>
<li><b>Estado inicial.</b> Punto de partida del proceso.</li>
<li><b>Estados objetivo.</b> Configuraciones que satisfacen los criterios de resolución.</li>
<li><b>Operadores o acciones.</b> Mecanismos de transición. Cada operador tiene <b>precondiciones</b> y <b>efectos</b>.</li>
<li><b>Función sucesora.</b> Determina qué estados son directamente alcanzables desde un estado dado.</li>
</ol>
<p>La representación <b>explícita</b> enumera todos los estados con sus conexiones y solo sirve para espacios pequeños. La <b>implícita</b> los calcula dinámicamente con reglas generativas y es imprescindible en espacios extensos.</p>
<p>La <b>explosión combinatoria</b> es el crecimiento exponencial de estados al aumentar las variables. En el ejemplo logístico de cinco clientes con un vehículo hay <em class="dato">5! = 120</em> rutas completas. No es un problema de hardware: ningún poder de cómputo la resuelve por fuerza bruta.</p>
<p>Un <b>algoritmo de búsqueda</b> requiere cinco elementos distintos de los anteriores: estado inicial, conjunto de operadores, prueba de objetivo, estructura de datos para los estados por explorar, y función para detectar estados ya visitados y evitar ciclos.</p>`,

24:`<p><b>La tabla completa de algoritmos con sus garantías:</b></p>
<table><tr><th>Algoritmo</th><th>Tipo</th><th>Cómo explora</th><th>Garantías</th></tr>
<tr><td>Amplitud (BFS)</td><td>No informada</td><td>Todos los nodos de un nivel antes de pasar al siguiente</td><td>Óptima en número de pasos, consume mucha memoria</td></tr>
<tr><td>Profundidad (DFS)</td><td>No informada</td><td>Un camino hasta el final antes de retroceder</td><td>Menos memoria, no garantiza optimalidad, puede caer en caminos infinitos</td></tr>
<tr><td><b>Costo uniforme</b></td><td><b>No informada</b></td><td>Como BFS, pero expande el nodo de <b>menor costo acumulado</b></td><td>Solución de menor costo si todos los costos son positivos</td></tr>
<tr><td>Profundidad limitada</td><td>No informada</td><td>DFS con profundidad máxima</td><td>Evita caminos infinitos</td></tr>
<tr><td>Primero el mejor</td><td>Informada</td><td>Ordena los nodos según una función de evaluación</td><td>Depende de cómo se defina la función</td></tr>
<tr><td>Voraz</td><td>Informada</td><td>Expande el nodo que parece más cerca del objetivo</td><td>No garantiza optimalidad</td></tr>
<tr><td>A*</td><td>Informada</td><td>Combina costo acumulado con estimación heurística al objetivo</td><td>Completa y óptima si la heurística es admisible</td></tr></table>
<p>La línea que separa informada de no informada es si el algoritmo usa una <b>estimación del dominio hacia el objetivo</b>. El costo acumulado no cuenta: es información real ya recorrida, no conocimiento del dominio.</p>
<p>Otros tipos que se nombran sin desarrollar: <b>minimax</b> y <b>poda alfa-beta</b> para adversarios, <b>hill climbing</b> y <b>simulated annealing</b> como búsquedas locales, y <b>algoritmos genéticos</b> con selección, cruce y mutación.</p>
<p>Errata declarada del material: la primera actividad de repaso de M02 L3 tiene un distractor que dice que BFS solo garantiza optimalidad cuando los costos varían, cuando es al revés.</p>`,

25:`<p><b>A* es completa y óptima si la heurística es admisible</b>, es decir si <b>no sobreestima el costo real</b>. Sin esa condición la afirmación de optimalidad no se sostiene. Es el detalle más preguntable de la lección.</p>
<p>Las tres búsquedas informadas y qué mira cada una:</p>
<table><tr><th>Algoritmo</th><th>Qué usa para decidir</th></tr>
<tr><td>Primero el mejor</td><td>Una función de evaluación cualquiera</td></tr>
<tr><td>Voraz</td><td><b>Solo</b> la estimación al objetivo</td></tr>
<tr><td>A*</td><td>Costo acumulado <b>más</b> estimación al objetivo</td></tr></table>
<p><b>Los cuatro criterios de comparación de algoritmos:</b> completitud, optimalidad, complejidad espacial y complejidad temporal.</p>
<p>El cálculo del ajedrez es lo que justifica el uso de heurísticas: el factor de ramificación promedio es <em class="dato">35</em>, y con ochenta turnos el árbol llega a unas <em class="dato">35 elevado a 80</em> posiciones, número que el PDF compara con los <em class="dato">10 elevado a 80</em> átomos estimados del universo observable y señala que lo supera ampliamente.</p>
<p>Hueco de soporte declarado: el PDF de M02 L3 es un escaneo sin capa de texto y el resumen se construyó por reconocimiento óptico de caracteres. Los valores 35, 35 elevado a 80, 5! = 120 y el 80 por ciento del ejemplo deductivo conviene verificarlos contra la pantalla.</p>`,

26:`<p><b>Los tres tipos de razonamiento con el ejemplo textual del PDF:</b></p>
<table><tr><th>Razonamiento</th><th>Dirección</th><th>Ejemplo del PDF</th></tr>
<tr><td>Deductivo</td><td>De premisas generales a conclusiones específicas</td><td>Si los clientes que compran en línea tienen 80 % de retención y un cliente nuevo compra en línea, se deduce que tiene alta probabilidad de retenerse</td></tr>
<tr><td>Inductivo</td><td>De observaciones específicas a patrones generales</td><td>Si las ventas suben en ciertos meses, se infiere que el patrón se repetirá</td></tr>
<tr><td><b>Abductivo</b></td><td><b>De hechos observados a la explicación más plausible</b></td><td><b>Si aumentan las quejas, se infiere que hay un problema con un producto</b></td></tr></table>
<p>La cátedra aclara que la inferencia <b>inductiva no siempre es correcta</b> y que la <b>abductiva genera hipótesis que hay que investigar</b>. Esa reserva forma parte de la definición y es lo que separa abductivo de deductivo: el deductivo concluye, el abductivo propone.</p>
<p>El <b>sistema experto</b> es el otro contenido del mismo apartado. Tiene dos componentes: la <b>base de conocimientos</b>, que guarda la información del problema con cuatro notaciones, reglas, predicados, redes semánticas y objetos; y el <b>motor de inferencia</b>, que integra hechos y preguntas y usa esa base para producir resultados. La cátedra repite dos veces la aclaración que lo separa de un modelo de aprendizaje automático: las reglas están <b>explícitamente codificadas por expertos humanos</b>.</p>`,

27:`<p><b>Los cinco niveles de análisis del PLN, secuenciales y jerárquicos:</b></p>
<ol>
<li><b>Tokenización.</b> Segmenta el texto en unidades.</li>
<li><b>Análisis morfológico.</b> Estructura interna de las palabras.</li>
<li><b>Análisis sintáctico.</b> Identifica la estructura gramatical con sujeto, verbo y objeto.</li>
<li><b>Análisis semántico.</b> Da el significado.</li>
<li><b>Análisis pragmático.</b> Interpreta según contexto e intención.</li>
</ol>
<p>Los sistemas modernos agregan <b>preprocesamiento</b> antes de la tokenización, con normalización, eliminación de palabras irrelevantes y <b>lematización</b>, y después del pragmático suman resolución de referencias, análisis del discurso y generación de respuestas. Ojo: la lematización pertenece al preprocesamiento, no a los cinco niveles clásicos.</p>
<p><b>Los seis desafíos actuales:</b> ambigüedad lingüística, diversidad lingüística, contextualización, lenguaje figurado, sesgos en los datos de entrenamiento, y privacidad y ética.</p>
<p>Este par ya se tomó dos veces con respuesta distinta, y es la trampa más cara de la lección. Cuando el objeto es una <b>consulta de un paciente</b>, alcanza con el <b>semántico</b>. Cuando el objeto es una <b>nota médica profesional</b>, donde el mismo término cambia de sentido según el contexto clínico, ya es <b>pragmático</b>. Mirar quién escribe y con qué intención.</p>`,

28:`<p><b>Las seis propiedades del entorno de tarea:</b></p>
<table><tr><th>Propiedad</th><th>Valores</th><th>Cómo distinguirlos</th></tr>
<tr><td>Observabilidad</td><td>Totalmente / Parcialmente observable</td><td>Los sensores dan acceso completo al estado, o hay partes inaccesibles</td></tr>
<tr><td>Número de agentes</td><td>Único / Múltiples</td><td>Los múltiples pueden ser competitivos, como el ajedrez, o cooperativos, como evitar colisiones</td></tr>
<tr><td>Determinismo</td><td>Determinista / No determinista</td><td>El siguiente estado queda determinado por el estado actual y la acción, o hay incertidumbre</td></tr>
<tr><td>Secuencialidad</td><td>Episódico / Secuencial</td><td>Experiencias atómicas independientes, como clasificar piezas, contra acciones que afectan decisiones futuras, como conducir</td></tr>
<tr><td><b>Dinamismo</b></td><td><b>Estático / Dinámico / Semidinámico</b></td><td><b>Estático el crucigrama, dinámico el tráfico, semidinámico el ajedrez con reloj, donde el entorno no cambia pero el rendimiento sí</b></td></tr>
<tr><td>Continuidad</td><td>Discreto / Continuo</td><td>El ajedrez tiene estados finitos, la conducción tiene un rango infinito de valores</td></tr></table>
<p>Dos observaciones que la cátedra agrega: cuanto más restringido es el entorno más sencillo es el diseño del agente, y los entornos virtuales pueden ser tan complejos como los físicos. La continuidad aplica a tres cosas a la vez: el estado del entorno, el tiempo, y las percepciones y acciones.</p>
<p>Las propiedades del entorno aparecieron <b>tres veces</b> en las 28 preguntas ya tomadas, siempre con la observabilidad parcial como respuesta.</p>`,

29:`<p><b>Los cinco tipos de agente. Son acumulativos: cada uno se apoya en los componentes del anterior.</b></p>
<table><tr><th>Tipo</th><th>Qué agrega</th><th>Mecanismo</th><th>Ejemplo de la cátedra</th></tr>
<tr><td>Reactivo simple</td><td>Nada, es la base</td><td>Reglas condición-acción sobre la percepción actual</td><td>Termostato doméstico básico</td></tr>
<tr><td>Reactivo basado en modelo</td><td>Memoria del entorno</td><td>Representación interna que rastrea lo no observable y predice estados futuros</td><td>Robot aspirador que construye un mapa</td></tr>
<tr><td>Basado en objetivos</td><td>Representación explícita de la meta</td><td>Búsqueda y planificación para evaluar secuencias de acciones</td><td>Sistema de navegación GPS</td></tr>
<tr><td><b>Basado en utilidad</b></td><td><b>Comparación entre objetivos en conflicto</b></td><td><b>Función de utilidad que asigna valor numérico a los estados</b></td><td><b>Asistente de inversiones financieras</b></td></tr>
<tr><td>Que aprende</td><td>Modificación de sus propios componentes</td><td>Aprendizaje por refuerzo, supervisado o no supervisado</td><td>Recomendación en plataforma de streaming</td></tr></table>
<p><b>Precisiones por tipo que aparecen en las consignas:</b></p>
<ul>
<li>El <b>reactivo simple</b> funciona exclusivamente en el presente inmediato. El termostato no recuerda cuántas veces encendió la calefacción hoy, ni aprende cuándo suele bajar la temperatura, ni anticipa el enfriamiento nocturno.</li>
<li>El <b>basado en modelo</b> es el que maneja entornos <b>parcialmente observables</b>. Esa es su capacidad decisiva.</li>
<li>El <b>basado en objetivos</b> se distingue por la <b>replanificación</b> ante obstáculos inesperados y por considerar el futuro al decidir en el presente.</li>
<li>El <b>basado en utilidad</b> maneja cuatro cosas que los objetivos no cubren: objetivos parciales o graduales, compromisos entre objetivos conflictivos, incertidumbre sobre los resultados, y preferencias complejas que no se expresan de forma binaria.</li>
<li>El <b>que aprende</b> parte de conocimiento limitado, descubre patrones no programados, generaliza a situaciones nuevas y puede evolucionar más allá de lo previsto por sus diseñadores. En el ejemplo de recomendación, la retroalimentación <b>implícita</b> es qué contenidos ve el usuario y cuánto tiempo, y la <b>explícita</b> son las calificaciones.</li>
</ul>
<p>Dato del material: la utilidad del ejemplo del asistente de inversiones es cartera A 3,4 contra cartera B 2,8. Y cuando el entorno es parcialmente observable <b>y</b> hay objetivos en conflicto, la respuesta que la cátedra dio por correcta fue un <b>agente híbrido</b> de utilidad y aprendizaje, nunca un tipo puro.</p>`,

30:`<p><b>Los cuatro términos que la cátedra separa:</b></p>
<table><tr><th>Término</th><th>Definición</th></tr>
<tr><td>Percepción</td><td>El contenido que los sensores captan en un momento determinado</td></tr>
<tr><td>Secuencia de percepciones</td><td>El historial completo de todo lo percibido hasta el momento</td></tr>
<tr><td><b>Función de agente</b></td><td><b>Mapeo matemático de cualquier secuencia de percepciones a una acción. Concepto teórico</b></td></tr>
<tr><td><b>Programa de agente</b></td><td><b>La aplicación concreta de esa función. Código que se ejecuta en la arquitectura</b></td></tr></table>
<p><b>Estructura.</b> La ecuación es <b>agente igual a arquitectura más programa</b>. La arquitectura es el cuerpo, con hardware, sensores y actuadores. El programa es el cerebro, el software que procesa percepciones y determina acciones. La función no aparece en esa ecuación porque es el concepto teórico, no una pieza del sistema. La compatibilidad entre arquitectura y programa se ilustra con una frase memorable: no tendría sentido diseñar un programa que genere la acción caminar si la arquitectura no dispone de piernas.</p>
<p>La definición de agente es deliberadamente amplia y abarca robots físicos, programas de software y organismos vivos. Los agentes pueden ser <b>físicos</b> o <b>virtuales</b>. Las cuatro características del ciclo percepción-decisión-acción son percibir con sensores, decidir sobre esa información, actuar mediante <b>actuadores</b>, y tener algún grado de autonomía.</p>
<p><b>Los cuatro factores que determinan la racionalidad:</b> medida de rendimiento que define el éxito, conocimiento previo del entorno, acciones posibles, y secuencia completa de percepciones hasta el momento actual. Racionalidad no es omnisciencia: se maximiza el rendimiento <b>esperado</b>, no el perfecto.</p>`

103:`<p>La palabra <b>robot</b> aparece en 1920, en <em class="dato">R.U.R.</em>, del checo <b>Karel Čapek</b>. Deriva de <b>robota</b>, trabajo forzado o servidumbre. La obra instaló además el arquetipo de la rebelión de las máquinas.</p>
<p><b>Las Tres Leyes de la Robótica</b>, que Asimov formula en 1942 en el relato Runaround:</p>
<ol>
<li>Un robot no puede dañar a un ser humano ni, por inacción, permitir que sufra daño.</li>
<li>Un robot debe obedecer las órdenes humanas, salvo que entren en conflicto con la primera ley.</li>
<li>Un robot debe proteger su propia existencia, salvo que eso entre en conflicto con las dos anteriores.</li>
</ol>
<p>Lo evaluable es el <b>orden de prioridad</b> entre las tres, no el texto exacto.</p>
<p>El resto de la sección recorre HAL 9000, Blade Runner, Terminator y WALL-E, y después muestra las contrapartes reales: asistentes de voz, sistemas de recomendación, reconocimiento facial, navegación. La idea que la cátedra deja es que la ficción funciona como horizonte y que el progreso técnico no ocurre aislado de la cultura.</p>`,

106:`<p><b>Internet de las cosas.</b> El término lo acuña <b>Kevin Ashton</b>, investigador del <b>MIT</b>, en <em class="dato">1999</em>, mientras trabajaba para <b>Procter &amp; Gamble</b>. Los cuatro datos son preguntables por separado.</p>
<p><b>Las cuatro etapas, en orden:</b></p>
<ol>
<li>Adquisición de datos mediante sensores</li>
<li>Compartición a través de redes</li>
<li>Procesamiento de la información</li>
<li>Toma de decisiones sobre el análisis integrado</li>
</ol>
<p>Los <b>sensores</b> captan y los <b>actuadores</b> ejecutan, y ese par cierra el flujo bidireccional entre lo digital y lo físico. En el núcleo hay un <b>motor de reglas</b> que implementa la lógica y las automatizaciones.</p>
<p>El desafío de seguridad tiene ejemplo con fecha y cifra: la botnet <b>Mirai</b>, en <em class="dato">2016</em>, con más de <em class="dato">600.000</em> dispositivos infectados en un ataque DDoS.</p>
<p>Fechas y nombres de la lección que se cruzan entre sí: Ashton, MIT, 1999 para IoT. Doug Laney, META Group, 2001 para las tres V.</p>`,

</ol>
<p>Es uno de los cuatro contenidos del módulo 01 que la cátedra ya evaluó, y el distractor que usó fue la misma frase con el orden invertido.</p>
<p>La red tiene <b>tres tipos de capa</b>: entrada, ocultas y salida. El término aprendizaje profundo surge cuando hay <b>múltiples capas ocultas</b>. Cada neurona combina las señales ponderadas de la capa anterior aplicando una <b>función de activación</b> como ReLU, sigmoide o tangente hiperbólica. La fuerza de las conexiones son los <b>pesos</b>, que se ajustan por <b>retropropagación del error</b>.</p>`,

110:`<p>La <b>IA generativa</b> crea contenido nuevo, original y coherente. La <b>IA tradicional</b> clasifica, identifica patrones y decide sobre datos existentes. El punto de inflexión es <b>ChatGPT, a fines de 2022</b>.</p>
<p>La aclaración que el PDF pone en recuadro aparte: los <b>Transformers</b> son la tecnología habilitadora de los avances en generación de lenguaje, <b>pero no la única aproximación</b> a sistemas generativos. En visión artificial el material nombra <b>GAN</b> y transferencia de estilo neuronal para creación de imágenes.</p>
<p>Los cuatro puntos que la cátedra desmiente más de una vez, y esa repetición suele anticipar la pregunta: reducir el big data al volumen, que la IA generativa se reduce a los Transformers, que las reglas del sistema experto las codifican humanos, y que los actuadores cierran el ciclo del agente.</p>`,

111:`<p>La visión es un <b>problema inverso</b>: reconstruir información tridimensional y contextual a partir de datos incompletos, que son una imagen bidimensional.</p>
<p>De ahí la distinción que abre la lección. Los <b>gráficos por computadora</b> van de descripciones matemáticas a imágenes, es decir <b>generan</b>. La <b>visión por computadora</b> va de imágenes a comprensión del mundo, es decir <b>interpreta</b>. Son procesos inversos entre sí.</p>
<p>En la analogía estructural el ojo equivale a los dispositivos sensores y el cerebro a los intérpretes. Los intérpretes son algoritmos de procesamiento de imagen, redes neuronales artificiales, redes convolucionales, arquitecturas avanzadas como R-CNN, YOLO y transformers visuales, y sistemas de razonamiento visual.</p>
<p>Hueco declarado del material: la <b>iluminación artificial</b>, que da nombre a la lección, no se desarrolla en ninguna sección. Conviene consultarlo con la cátedra antes del parcial.</p>`,

112:`<p><b>Las dos distinciones vecinas que la lección evalúa:</b></p>
<table><tr><th>Concepto</th><th>Qué es</th></tr>
<tr><td>Procesamiento de imágenes</td><td>Ajustar brillo, contraste y filtros. Operación de bajo nivel</td></tr>
<tr><td>Visión por computadora</td><td>Interpretar el significado y el contexto</td></tr>
<tr><td>Visión</td><td>Capturar datos visuales</td></tr>
<tr><td>Percepción visual</td><td>Darles sentido en un marco contextual</td></tr></table>
<p>El ejemplo de la cátedra para la última fila: el vehículo autónomo no solo detecta al peatón, interpreta su velocidad, su dirección y sus intenciones.</p>
<p>El <b>pipeline del sistema de visión</b> tiene cuatro etapas: datos de entrada, preprocesamiento con estandarización de dimensiones, escala de grises y aumento de datos, extracción de características, y modelo de aprendizaje automático. Ajustar brillo y contraste cae dentro del preprocesamiento, la segunda etapa.</p>
<p>En el caso farmacéutico la cátedra encadena cuatro ideas, y la primera es justamente esta: es percepción visual y no procesamiento de imágenes.</p>`,

113:`<p><b>Los seis sensores del sistema de visión:</b></p>
<table><tr><th>Sensor</th><th>Qué capta</th></tr>
<tr><td>Cámaras tradicionales</td><td>Luz visible en formato RGB</td></tr>
<tr><td>Cámaras infrarrojas o térmicas</td><td>Radiación infrarroja, es decir calor. Permiten ver en oscuridad</td></tr>
<tr><td>Cámaras hiperespectrales</td><td>Múltiples bandas del espectro electromagnético</td></tr>
<tr><td><b>LiDAR</b></td><td><b>Pulsos láser para medir distancias y crear mapas tridimensionales</b></td></tr>
<tr><td>Radar</td><td>Ondas de radio para detectar objetos y velocidad, incluso con clima adverso</td></tr>
<tr><td>Sensores médicos</td><td>Tomógrafos, resonancias, rayos X</td></tr></table>
<p>LiDAR y radar es un par fijo que la cátedra usa para armar opciones incorrectas: láser contra ondas de radio.</p>`,

114:`<p><b>Los ocho fundamentos disciplinarios, en el orden de la cátedra:</b></p>
<ol>
<li>Filosofía, que aporta la pregunta y la forma lógica</li>
<li>Matemáticas, que aportan el lenguaje formal</li>
<li>Economía, que aporta el criterio de decisión</li>
<li>Neurociencia, que aporta el modelo de referencia</li>
<li>Psicología, que aporta el modelo de referencia</li>
<li>Ingeniería informática, que aporta el sustrato material</li>
<li>Teoría de control y cibernética, que aportan el mecanismo de retroalimentación</li>
<li>Lingüística, que aporta el dominio del lenguaje</li>
</ol>
<p>Teoría de control y cibernética cuentan como <b>un solo</b> fundamento. Contarlos como dos da nueve y hace fallar los ítems de tipo indique cuántos.</p>
<p>Los hitos de hardware con fecha, dentro de ingeniería: 1805 telar de Jacquard, que separa los datos del patrón a tejer de las instrucciones para crearlo. 1941 Z3 de Zuse, primera computadora programable funcional. 1945 ENIAC, primera electrónica de propósito general. 1947 transistor, de Shockley, Bardeen y Brattain. 2012 GPU aplicadas al aprendizaje profundo, y después las TPU de Google.</p>
<p>Contradicción declarada del material: los datos del ENIAC no coinciden entre lecciones. M02 L1 dice 18.000 tubos de vacío, 30 toneladas y 160 kilowatts. M02 L2 dice 167 metros cuadrados y 27 toneladas. Si aparece en una consigna, mirar de qué lección viene.</p>`,

115:`<p><b>Los aportes matemáticos que se cruzan entre sí:</b></p>
<table><tr><th>Autor</th><th>Aporte</th></tr>
<tr><td>Bayes</td><td>Regla para actualizar creencias ante nueva evidencia. Tres términos: probabilidad de observar el dato si la hipótesis es cierta, probabilidad inicial de la hipótesis, probabilidad general de observar el dato</td></tr>
<tr><td>Laplace</td><td>Antecedente de las redes bayesianas, que representan dependencias probabilísticas entre variables. Su demonio se lee como primera formulación del sueño de la IA</td></tr>
<tr><td>Fisher</td><td>Pruebas de hipótesis, análisis de varianza y diseño experimental. Permiten distinguir un patrón genuino de ruido aleatorio</td></tr>
<tr><td>Turing</td><td>Máquina de Turing y problema de la parada, en On Computable Numbers, 1936</td></tr>
<tr><td>Church</td><td>Cálculo lambda, en paralelo a Turing. Su equivalencia es la tesis de Church-Turing</td></tr>
<tr><td><b>Shannon</b></td><td><b>Teoría de la información. Conecta la lógica booleana con los circuitos eléctricos en su tesis de maestría de 1937. La entropía mide la incertidumbre promedio de una variable aleatoria</b></td></tr></table>
<p>Los tres nombres de otras disciplinas que aparecen como distractores: <b>Bellman</b> es economía, con programación dinámica y procesos de decisión de Markov, base del aprendizaje por refuerzo. <b>Wiener</b> es cibernética, acuña el término y publica el libro en 1948. <b>Chomsky</b> es lingüística, con Estructuras Sintácticas de 1957, gramática universal innata y jerarquía formal de lenguajes.</p>
<p>Hueco declarado: las fórmulas del teorema de Bayes y de la entropía de Shannon son imágenes sin texto extraíble en el PDF. Si la cátedra las pide escritas hay que sacarlas de Russell y Norvig.</p>`,

116:`<p><b>Las cuatro capacidades para superar el Test de Turing:</b></p>
<ol>
<li><b>Procesamiento del lenguaje natural</b>, para comunicarse con fluidez</li>
<li><b>Representación del conocimiento</b>, para almacenar información, conceptos y emociones simuladas</li>
<li><b>Razonamiento automático</b>, para responder preguntas complejas</li>
<li><b>Aprendizaje automático</b>, para adaptarse a nuevas circunstancias</li>
</ol>
<p>El caso de fracaso que trae la cátedra es <b>Tay</b>, el chatbot que Microsoft lanzó en Twitter en 2016 y que en menos de 24 horas publicaba mensajes ofensivos.</p>
<p>El Test de Turing corresponde al cuadrante de los sistemas que <b>actúan como humanos</b>, porque evalúa la conducta observable y no el proceso mental. Turing lo publica en 1950 en la revista Mind, en Computing Machinery and Intelligence, con la pregunta: ¿pueden pensar las máquinas?</p>`,

117:`<p><b>Los tres sistemas expertos de la era rentable, 1980 a 1987:</b></p>
<table><tr><th>Sistema</th><th>Dominio</th><th>Resultado</th></tr>
<tr><td><b>XCON</b></td><td>Configuración de computadoras para Digital Equipment Corporation</td><td>Ahorro estimado de <em class="dato">40 millones de dólares anuales</em></td></tr>
<tr><td>MYCIN</td><td>Diagnóstico de infecciones bacterianas, Stanford</td><td>Superó a médicos junior en algunas evaluaciones</td></tr>
<tr><td>PROSPECTOR</td><td>Exploración geológica</td><td>Ayudó a descubrir un depósito de molibdeno valorado en cientos de millones</td></tr></table>
<p><b>DENDRAL</b> no pertenece a esa era: es de 1964, de Feigenbaum y Lederberg en Stanford, identifica estructuras químicas orgánicas y es uno de los primeros sistemas expertos.</p>
<p><b>Las tres limitaciones que explican el segundo invierno</b>, 1987 a 1993: costo de desarrollo altísimo, con meses o años de entrevistas a expertos; falta de flexibilidad fuera de dominios muy específicos; y mantenimiento problemático, porque las reglas nuevas generaban conflictos con las existentes.</p>
<p>El proyecto japonés de quinta generación es de 1982, con diez años y 850 millones de dólares. La reacción estadounidense forma el MCC.</p>`,

118:`<table><tr><th>Sistema</th><th>Año</th><th>Dominio</th><th>Cómo funcionaba</th></tr>
<tr><td><b>Deep Blue</b></td><td>1997</td><td>Ajedrez, derrota a Kasparov</td><td><b>Principalmente fuerza bruta</b>, millones de posiciones por segundo</td></tr>
<tr><td>Watson</td><td>2011</td><td>Jeopardy!</td><td>Lenguaje natural, base de conocimiento enorme, respuestas con nivel de confianza</td></tr>
<tr><td>AlphaGo</td><td>2016</td><td>Go, derrota a Lee Sedol</td><td>Aprendizaje supervisado de partidas humanas más refuerzo jugando contra sí mismo</td></tr></table>
<p>Deep Blue y Watson son los dos de IBM y por eso la cátedra los cruza. La marca que los separa es fuerza bruta contra lenguaje natural, y 1997 contra 2011.</p>
<p>Los dos caen en la etapa de <b>recuperación silenciosa</b>, 1993 a 2011, marcada por el enfoque pragmático. AlphaGo ya pertenece a la <b>revolución del aprendizaje profundo</b>, 2012 a 2019, junto con AlexNet y BERT.</p>`,

119:`<p><b>Las siete áreas de aplicación con su fusión disciplinar:</b></p>
<table><tr><th>Área</th><th>Fusión disciplinar</th><th>Aplicaciones</th></tr>
<tr><td>Búsqueda y planificación</td><td>Filosofía y matemáticas</td><td>Navegación GPS, logística empresarial</td></tr>
<tr><td>Representación del conocimiento y razonamiento</td><td>Filosofía y lógica formal</td><td>Diagnóstico médico, asesoramiento legal, sistemas expertos</td></tr>
<tr><td>Machine learning</td><td>Matemática estadística y principios del aprendizaje</td><td>Análisis predictivo, detección de fraudes, recomendación</td></tr>
<tr><td>Deep learning</td><td>Neurociencia y matemática avanzada</td><td>Reconocimiento de imágenes, lenguaje, generación de contenido</td></tr>
<tr><td>Visión por computadora</td><td>Psicología de la percepción y procesamiento de señales</td><td>Vehículos autónomos, diagnóstico médico por imagen</td></tr>
<tr><td>Procesamiento del lenguaje natural</td><td>Lingüística, estadística y aprendizaje profundo</td><td>Asistentes virtuales, traductores, análisis de sentimiento</td></tr>
<tr><td><b>Robótica</b></td><td><b>Síntesis de todas las anteriores con ingeniería</b></td><td>Robots industriales, drones de exploración espacial</td></tr></table>
<p>Son <b>siete</b>, y el orden de la tabla es el de la cátedra. La robótica va última justamente porque integra a las otras seis.</p>`,

120:`<p><b>Búsqueda y planificación</b> usan las dos el espacio de estados. La diferencia es de <b>foco</b>: la búsqueda <b>explora caminos</b>, la planificación <b>diseña una secuencia ordenada de acciones</b>.</p>
<p><b>Los cinco requisitos de la planificación:</b></p>
<ol><li>Estado inicial</li><li>Objetivo</li><li>Acciones posibles</li><li>Conocimiento del impacto de cada acción</li><li>Restricciones</li></ol>
<p>Los sistemas reales usan lenguajes formales como <b>PDDL</b>, planning domain definition language.</p>
<p>Este par ya se tomó dos veces. Como verdadero o falso: la búsqueda identifica la mejor opción y la planificación crea estrategias coordinadas a lo largo del tiempo, <b>verdadero</b>. Como elección múltiple: la planificación considera <b>secuencias de acciones interdependientes</b>.</p>
<p>El <b>caso Waze</b> es el único desarrollado en todo el módulo y sirve de modelo. Los GPS tradicionales usaban búsqueda no informada de costo uniforme sobre la distancia. Waze usa búsqueda informada con A*, planifica un plan completo con horarios de congestión y preferencias del usuario, modela cada estado como una posición con sus condiciones de tráfico actualizadas dinámicamente, no puede explorar todo por la explosión combinatoria, y <b>replanifica constantemente</b> en vez de buscar sobre un grafo estático.</p>`,

121:`<p><b>El sistema experto tiene dos componentes:</b></p>
<table><tr><th>Componente</th><th>Qué hace</th></tr>
<tr><td>Base de conocimientos</td><td>Guarda la información del problema con cuatro notaciones: <b>reglas, predicados, redes semánticas y objetos</b></td></tr>
<tr><td>Motor de inferencia</td><td>Integra hechos y preguntas y usa esa base para producir resultados</td></tr></table>
<p>La cátedra repite <b>dos veces</b> en el mismo apartado la aclaración que lo separa de un modelo de aprendizaje automático: las reglas están <b>explícitamente codificadas por expertos humanos</b>.</p>
<p>Es uno de los cuatro puntos que el material desmiente más de una vez, y por eso la probabilidad de que aparezca es alta.</p>
<p>Choque de vocabulario: lo que en el trabajo es un motor de reglas o una capa de reglas de negocio, acá es un <b>paradigma completo</b> en el módulo 01, y los <b>componentes del sistema experto</b> en el módulo 02.</p>`,

122:`<p><b>Los cinco niveles de análisis del PLN, secuenciales y jerárquicos:</b></p>
<ol>
<li><b>Tokenización</b></li>
<li><b>Análisis morfológico</b></li>
<li><b>Análisis sintáctico</b>, que identifica la estructura gramatical con sujeto, verbo y objeto</li>
<li><b>Análisis semántico</b>, que da el significado</li>
<li><b>Análisis pragmático</b>, que interpreta según contexto e intención</li>
</ol>
<p>Los sistemas modernos agregan <b>preprocesamiento</b> antes de la tokenización, con normalización, eliminación de palabras irrelevantes y <b>lematización</b>. Después del pragmático suman resolución de referencias, análisis del discurso y generación de respuestas.</p>
<p><b>Los seis desafíos actuales:</b> ambigüedad lingüística, diversidad lingüística, contextualización, lenguaje figurado, sesgos en los datos de entrenamiento, y privacidad y ética.</p>
<p>Choque de vocabulario: tokenizer, stopwords y stemming acá son <b>tokenización, eliminación de palabras irrelevantes y lematización</b>. La cátedra usa las traducciones.</p>`,

123:`<p><b>La tabla completa de algoritmos con sus garantías:</b></p>`+T_ALGO+
`<p><b>Los cuatro criterios de comparación:</b> completitud, optimalidad, complejidad espacial y complejidad temporal.</p>
<p>Otros tipos que se nombran sin desarrollar: <b>minimax</b> y <b>poda alfa-beta</b> para adversarios, <b>hill climbing</b> y <b>simulated annealing</b> como búsquedas locales, y <b>algoritmos genéticos</b> con selección, cruce y mutación.</p>
<p>Errata declarada: la primera actividad de repaso de M02 L3 tiene un distractor que dice que BFS solo garantiza optimalidad cuando los costos varían, cuando es al revés.</p>`,

124:`<p>La <b>explosión combinatoria</b> es el crecimiento exponencial de estados al aumentar las variables. No es un problema de hardware: ningún poder de cómputo la resuelve por fuerza bruta, y de ahí que existan las heurísticas.</p>
<p><b>Los dos ejemplos numéricos de la lección:</b></p>
<table><tr><th>Ejemplo</th><th>Cifra</th></tr>
<tr><td>Logística, cinco clientes con un vehículo</td><td><em class="dato">5! = 120</em> rutas completas</td></tr>
<tr><td>Ajedrez, factor de ramificación promedio</td><td><em class="dato">35</em></td></tr>
<tr><td>Ajedrez, árbol con ochenta turnos</td><td>Del orden de <em class="dato">35 elevado a 80</em>, contra <em class="dato">10 elevado a 80</em> átomos estimados del universo observable</td></tr></table>
<p>La respuesta al problema es de representación, no de cómputo. La representación <b>explícita</b> enumera todos los estados con sus conexiones y solo sirve para espacios pequeños. La <b>implícita</b> los calcula dinámicamente con reglas generativas y es imprescindible en espacios extensos.</p>
<p>Choque de vocabulario: complejidad y big O acá se dicen <b>complejidad espacial y temporal</b> y <b>explosión combinatoria</b>, y se describen en prosa, sin notación.</p>`,

125:`<p><b>PEAS, con el ejemplo del vehículo autónomo:</b></p>
<table><tr><th>Letra</th><th>Término</th><th>Qué define</th><th>Ejemplo</th></tr>
<tr><td>P</td><td>Performance</td><td>Criterios de éxito</td><td>Llegar al destino, reducir combustible, tiempo e infracciones, aumentar seguridad y comodidad</td></tr>
<tr><td>E</td><td>Environment</td><td>Dónde y en qué condiciones opera</td><td>Calles urbanas y rurales, tráfico, peatones, clima</td></tr>
<tr><td><b>A</b></td><td><b>Actuators</b></td><td><b>Cómo actúa sobre el entorno</b></td><td><b>Volante, acelerador, freno, señales, pantalla, sistema de voz</b></td></tr>
<tr><td>S</td><td>Sensors</td><td>Cómo percibe el entorno</td><td>Cámaras, radar, GPS, sensores del motor, micrófonos</td></tr></table>
<p>La definición de agente: cualquier entidad que percibe su entorno a través de <b>sensores</b>, toma decisiones basadas en información y actúa sobre ese entorno mediante <b>actuadores</b>. Es deliberadamente amplia y abarca robots físicos, programas de software y organismos vivos.</p>
<p>Las cuatro características del ciclo percepción-decisión-acción: percibir con sensores, decidir sobre esa información, actuar mediante actuadores, y tener algún grado de autonomía. Que los actuadores cierran el ciclo está subrayado de forma explícita en la lección.</p>`,

126:`<p><b>Las medidas de rendimiento evalúan las secuencias de estados deseables del entorno</b>, y formularlas mal es el error clásico.</p>
<table><tr><th>Sistema</th><th>Medida mal formulada</th><th>Medida adecuada</th></tr>
<tr><td>Riego inteligente</td><td>Maximizar el agua distribuida, que lleva a regar en exceso</td><td>Mantener la humedad del suelo en el rango óptimo de cada planta</td></tr>
<tr><td>Vehículo autónomo</td><td>Valorar solo la velocidad, que produce conducción temeraria</td><td>Equilibrar tiempo de llegada, seguridad, cumplimiento de normas y consumo</td></tr></table>
<p><b>Los cuatro factores que determinan la racionalidad:</b> medida de rendimiento que define el éxito, conocimiento previo del entorno, acciones posibles, y secuencia completa de percepciones hasta el momento actual.</p>
<p>La definición formal: un agente racional es aquel que, para cada posible secuencia de percepciones, selecciona la acción que aumenta al máximo su <b>medida de rendimiento esperada</b>, considerando tanto la evidencia proporcionada por la secuencia de percepciones como su conocimiento incorporado.</p>
<p>Choque de vocabulario: KPI o métrica de negocio acá es <b>medida de rendimiento</b>. Y función objetivo o loss acá es <b>función de utilidad</b> y <b>utilidad esperada</b>, que viene de la teoría de la decisión de M02 L1.</p>
<p>Hueco declarado: el bloque del agente para un sistema de riego inteligente aparece en M02 L4 sin contenido desarrollado.</p>`,

127:`<p><b>Los cinco tipos de agente:</b></p>`+T_AGENTES+
`<p>El <b>reactivo simple</b> funciona exclusivamente en el presente inmediato. El ejemplo del termostato es textual de la cátedra: no recuerda cuántas veces encendió la calefacción hoy, ni aprende cuándo suele bajar la temperatura, ni anticipa el enfriamiento nocturno.</p>
<p>Choque de vocabulario: lo que en el trabajo es un job, un proceso o un servicio, acá es un <b>agente</b>. El agente se define por percepción y acción, no por ejecución.</p>`,

128:`<p><b>Los cinco tipos de agente:</b></p>`+T_AGENTES+
`<p>El <b>basado en modelo</b> es el que maneja entornos <b>parcialmente observables</b>, porque el modelo interno le permite recordar o inferir lo que está fuera de su campo perceptivo. Esa es su capacidad decisiva y el disparador que hay que reconocer en la consigna.</p>
<p>Los otros disparadores de la sección 4.3 del paquete:</p>
<table><tr><th>Si la consigna dice</th><th>La respuesta es</th></tr>
<tr><td>Reglas si-entonces sobre la percepción actual, sin memoria</td><td>Reactivo simple</td></tr>
<tr><td>Modelo interno que permite operar con observabilidad parcial</td><td>Reactivo basado en modelo</td></tr>
<tr><td>Replanifica ante obstáculos para alcanzar una meta</td><td>Basado en objetivos</td></tr>
<tr><td>Equilibra objetivos que compiten asignando valores numéricos</td><td>Basado en utilidad</td></tr>
<tr><td>Mejora con los resultados observados</td><td>Que aprende</td></tr>
<tr><td>Entorno parcialmente observable con objetivos en conflicto</td><td>Híbrido de utilidad y aprendizaje, nunca un tipo puro</td></tr></table>`,

129:`<p><b>Los cuatro factores que determinan la racionalidad:</b></p>
<ol>
<li>La <b>medida de rendimiento</b> que define el éxito</li>
<li>El <b>conocimiento previo</b> del entorno</li>
<li>Las <b>acciones</b> posibles</li>
<li>La <b>secuencia completa de percepciones</b> hasta el momento actual</li>
</ol>
<p>La velocidad de procesamiento pertenece a la <b>arquitectura</b>, no a la racionalidad. La ecuación de la cátedra es <b>agente igual a arquitectura más programa</b>: la arquitectura es el cuerpo, con hardware, sensores y actuadores; el programa es el cerebro, el software que procesa percepciones y determina acciones.</p>
<p>La compatibilidad entre los dos se ilustra con una frase memorable: no tendría sentido diseñar un programa que genere la acción caminar si la arquitectura no dispone de piernas.</p>
<p>Racionalidad no es omnisciencia: se maximiza el rendimiento <b>esperado</b>. De ahí dos obligaciones del agente racional: recolectar información cuando eso beneficia su desempeño, y aprender de sus percepciones para compensar conocimiento incompleto.</p>`,

130:`<p>La definición formal de la cátedra:</p>
<blockquote>Un agente racional se define como aquel que, para cada posible secuencia de percepciones, selecciona la acción que aumenta al máximo su medida de rendimiento esperada, considerando tanto la evidencia proporcionada por la secuencia de percepciones como su conocimiento incorporado.</blockquote>
<p>La palabra que decide el ítem es <b>esperada</b>. Racionalidad no es omnisciencia, y una decisión racional puede terminar mal.</p>
<p>De ahí las <b>dos obligaciones del agente racional</b>: recolectar información cuando eso beneficia su desempeño, y aprender de sus percepciones para compensar conocimiento incompleto.</p>
<p><b>El patrón de los absolutos</b>, que sirvió en las tres instancias evaluadas sin una sola excepción: toda opción que contenga solo, únicamente, exclusivamente, nunca, siempre, por completo, necesariamente o puramente resultó falsa. Cuando la duda está entre dos opciones y una tiene un adverbio absoluto, la respuesta es la otra. Las opciones correctas suelen estar redactadas con matices, como principalmente, mejor equilibrio o con predominio de.</p>`,

<p>Choque de vocabulario: idempotencia o tarea sin estado acá es <b>entorno episódico</b>. Es propiedad del entorno, no del proceso.</p>

const D_FILOSOFIA=`<b>Dualismo y materialismo</b> son las dos respuestas clásicas a si la mente es algo aparte del cuerpo. El <b>dualismo</b>, que arranca con Descartes, dice que hay una parte de la mente que escapa a las leyes físicas. El <b>materialismo</b> dice que no: que lo que llamamos mente es lo que hace el cerebro siguiendo esas leyes. Y el <b>empirismo</b> agrega de dónde sale lo que sabemos: nada existe en la mente que no haya pasado antes por los sentidos.`;
const D_APRENDE=`<b>El agente que aprende</b> se puede desarmar en cuatro piezas. El <b>elemento de actuación</b> es el que decide qué hacer, o sea el agente que ya conocías. La <b>crítica</b> mira el resultado y dice si estuvo bien o mal según un estándar. El <b>elemento de aprendizaje</b> toma esa evaluación y modifica el elemento de actuación. Y el <b>generador de problemas</b> propone acciones nuevas a propósito, para explorar en vez de repetir siempre lo mismo que ya funciona.`;
const D_BIDIRECCIONAL=`<b>La búsqueda bidireccional</b> corre dos búsquedas a la vez, una desde el punto de partida hacia adelante y otra desde la meta hacia atrás, y para cuando se cruzan en el medio. La ganancia es de tamaño: en vez de un árbol que crece hasta la profundidad total, son dos árboles que crecen hasta la mitad, y eso reduce muchísimo la cantidad de nodos.`;

function estado(items){

  return {resp:con.length,tot:items.length,pct:Math.round(ok/con.length*100)};

/* ---------- Índice ---------- */
function arbol(){
  const base=BANCO();
  const claves = modo==="quiz" ? ["01","02"] : [...new Set(base.map(x=>x.inst))];
  const mods=claves.map(c=>{
    const sub = modo==="quiz" ? base.filter(x=>x.mod===c) : base.filter(x=>x.inst===c);
    let hojas;
    if(modo==="quiz"){
      hojas=[...new Set(sub.map(x=>x.lec))].sort().map(l=>{
        const s2=sub.filter(x=>x.lec===l);
        return {k:c+l,t:l+" · "+s2[0].tema,c:s2.length,e:estado(s2)};
      });
    } else {
      hojas=[...new Set(sub.map(x=>x.tema))].map(t=>{
        const s2=sub.filter(x=>x.tema===t);
        return {k:"t:"+c+"|"+t,t:t,c:s2.length,e:estado(s2)};
      });
    }
    return {k:(modo==="quiz"?"mod":"i:")+c, t:(modo==="quiz"?"Módulo "+c:c),
            c:sub.length, hojas:hojas, e:estado(sub)};
  });
  const porOrigen=o=>base.filter(q=>ORIGEN(q)===o);
  const extras=[{k:"flag",t:"Marcadas para repasar",c:marcadas().length,e:estado(marcadas()),marca:true}];
  (modo==="quiz"?["paquete","propia"]:modo==="tps"?["catedra","mixto","propio"]:["preguntero","errado"]).forEach(o=>{
    const sub=porOrigen(o);
    if(sub.length) extras.push({k:"src:"+o,
      t:(o==="paquete"?"Solo las del paquete":o==="propia"?"Solo las de práctica":
         o==="catedra"?"Opciones de la cátedra":o==="mixto"?"Opciones en parte reconstruidas":
         o==="propio"?"Opciones reconstruidas":o==="preguntero"?"Verificadas contra el material":
         "Donde el preguntero se equivoca"), c:sub.length, e:estado(sub)});
  });
  return {todo:{k:"todo",t:"Todo, repaso general",c:base.length,e:estado(base)},mods:mods,extras:extras};
}

function aplicar(){
  const base=BANCO();
  if(filtro==="todo") lista=[...base];
  else if(filtro==="flag") lista=marcadas();
  else if(filtro.startsWith("src:")) lista=base.filter(x=>ORIGEN(x)===filtro.slice(4));
  else if(filtro.startsWith("i:")) lista=base.filter(x=>x.inst===filtro.slice(2));
  else if(filtro.startsWith("mod")) lista=base.filter(x=>x.mod===filtro.slice(3));
  else if(filtro.startsWith("t:")){const pt=filtro.slice(2).split("|");
    lista=base.filter(x=>x.inst===pt[0]&&x.tema===pt[1]);}
  else lista=base.filter(x=>x.mod===filtro.slice(0,2)&&x.lec===filtro.slice(2));
  if(modo==="quiz") lista.sort((a,b)=>
    a.mod.localeCompare(b.mod)||a.lec.localeCompare(b.lec)||
    ORIGEN(a).localeCompare(ORIGEN(b))||a.n-b.n);
  else lista.sort((a,b)=>a.n-b.n);
  i=0;aciertos=0;resultados=[];
  pintarChips();render();
}

    '<span><i style="background:#7FA890"></i>90 o más</span>'+
    '<span><i style="background:#B6C9BC"></i>75 a 89</span>'+
    '<span><i style="background:#D9BE86"></i>60 a 74</span>'+
    '<span><i style="background:#C88A8A"></i>menos de 60</span>'+
    '<span><i style="background:#DEDAD6"></i>sin responder</span></span>';
  const btn=document.createElement("button");
  btn.textContent="Reiniciar el progreso";
  btn.onclick=()=>{if(confirm("Se borra el puntaje de todos los temas, en los dos bancos. ¿Seguimos?")){
    hist={};guardarHist();aplicar();}};
  pie.appendChild(btn);
  if(Object.keys(flags).length){
    const btn2=document.createElement("button");
    btn2.textContent="Quitar las "+Object.keys(flags).length+" banderas";
    btn2.onclick=()=>{if(confirm("Se quitan todas las banderas. El puntaje no se toca. ¿Seguimos?")){
      flags={};guardarFlags();aplicar();}};
    pie.appendChild(btn2);
  }
  cont.appendChild(pie);
}
