<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D4A3E">
<meta name="color-scheme" content="light">
<title>IA · Parcial 1 · Autoevaluación interactiva</title>
<style>
  :root{
    --texto:#1A1A1A;
    --titulo:#3D3D3D;
    --acento:#2D4A3E;
    --fondo:#FAF9F7;
    --panel:#FFFFFF;
    --borde:#E7E5E4;
    --ok:#2D4A3E;
    --okBg:#EAF1ED;
    --mal:#8C2F2F;
    --malBg:#F7EBEB;
    --tenue:#6B6B6B;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--fondo);
    color:var(--texto);
    font-family:Georgia,'Times New Roman',serif;
    font-size:16px;
    line-height:1.55;
  }

  /* ---------- Disposición de libro ---------- */
  /* ---------- Disposición de libro ---------- */
  /* ---------- Página y menú lateral ---------- */
  .wrap{max-width:1080px;margin:0 auto;padding:26px 24px 70px}
  header{text-align:center;margin-bottom:22px}
  header h1{margin:0 auto 5px}
  header p{margin:0 auto}

  .barraSup{display:flex;align-items:center;gap:16px;margin-bottom:9px;flex-wrap:wrap}
  .barraSup .estado{margin:0;flex:1;justify-content:flex-end}
  .burger{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;
    padding:7px 14px;border:1px solid var(--borde);background:var(--panel);
    color:var(--titulo);border-radius:3px;cursor:pointer;
    display:inline-flex;align-items:center;gap:10px;flex-shrink:0}
  .burger:hover{border-color:#C9C6C3}
  .ham{width:15px;height:2px;background:currentColor;border-radius:1px;display:block;
    box-shadow:0 -5px 0 currentColor,0 5px 0 currentColor}

  .panel{position:fixed;top:0;left:0;z-index:40;width:340px;max-width:86vw;height:100vh;
    background:var(--panel);border-right:1px solid var(--borde);overflow-y:auto;
    padding:18px 16px 26px;transform:translateX(-101%);transition:transform .22s ease}
  .panel.abierto{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.14)}
  .fondo{position:fixed;inset:0;z-index:30;background:rgba(26,26,26,.34);
    opacity:0;visibility:hidden;transition:opacity .22s ease}
  .fondo.abierto{opacity:1;visibility:visible}
  .panelTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
  .panelTop h2{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11.5px;
    letter-spacing:.07em;text-transform:uppercase;color:var(--tenue);margin:0;font-weight:600}
  .cerrarPanel{background:none;border:none;color:var(--tenue);cursor:pointer;
    font-size:16px;line-height:1;padding:2px 5px}
  .cerrarPanel:hover{color:var(--titulo)}

  @media (max-width:640px){
    .wrap{padding:20px 15px 60px}
    .barraSup .estado{justify-content:flex-start}
  }

  .ui{font-family:'Segoe UI',Helvetica,Arial,sans-serif}



  .estado{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;
    color:var(--tenue);margin-bottom:8px;gap:12px;flex-wrap:wrap;
  }
  .progreso{height:4px;background:var(--borde);border-radius:2px;overflow:hidden;margin-bottom:20px}
  .progreso div{height:100%;background:var(--acento);width:0;transition:width .25s}

  .tarjeta{
    background:var(--panel);border:1px solid var(--borde);border-radius:4px;
    padding:24px 24px 20px;
  }
  .meta{
    font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11.5px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);margin-bottom:10px;
  }
  .enunciado{font-size:17px;margin:0 0 18px}
  .enunciado b{font-weight:bold}

  .opciones{display:flex;flex-direction:column;gap:9px}
  .opcion{
    text-align:left;font-family:Georgia,serif;font-size:15.5px;line-height:1.45;
    padding:12px 15px;border:1px solid var(--borde);background:#fff;color:var(--texto);
    border-radius:3px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;
  }
  .opcion:hover:not(:disabled){border-color:#C9C6C3}
  .opcion:disabled{cursor:default}
  .letra{
    font-family:'Segoe UI',sans-serif;font-size:12px;font-weight:600;color:var(--tenue);
    border:1px solid var(--borde);border-radius:3px;min-width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
  }
  .opcion.correcta{background:var(--okBg);border-color:var(--ok)}
  .opcion.correcta .letra{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opcion.incorrecta{background:var(--malBg);border-color:var(--mal)}
  .opcion.incorrecta .letra{background:var(--mal);color:#fff;border-color:var(--mal)}

  .opcion.elegida{border-color:var(--acento);background:#F3F7F4}
  .opcion.elegida .letra{background:var(--acento);color:#fff;border-color:var(--acento)}
  .opcion.faltante{background:#EDF3EF;border-color:var(--ok);border-style:dashed}
  .opcion.faltante .letra{background:#fff;color:var(--ok);border-color:var(--ok)}
  .msPie{display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-top:13px;flex-wrap:wrap}
  .ayuda{font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--tenue)}
  .rotulo-ms{font-family:'Segoe UI',sans-serif;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--tenue);margin:0 0 9px;font-weight:600}
  .texto-libre{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .texto-libre input{
    font-family:Georgia,serif;font-size:15.5px;padding:10px 13px;
    border:1px solid var(--borde);border-radius:3px;background:#fff;color:var(--texto);
    min-width:190px;flex:1;
  }
  .texto-libre input:focus{outline:2px solid var(--acento);outline-offset:-1px}
  .btn{
    font-family:'Segoe UI',sans-serif;font-size:13.5px;padding:9px 18px;
    border:1px solid var(--acento);background:var(--acento);color:#fff;
    border-radius:3px;cursor:pointer;
  }
  .btn.sec{background:#fff;color:var(--acento)}
  .btn:disabled{opacity:.45;cursor:default}

  .feedback{margin-top:18px;padding-top:16px;border-top:1px solid var(--borde);display:none}
  .feedback.visible{display:block}
  .veredicto{
    font-family:'Segoe UI',sans-serif;font-size:13px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;margin-bottom:9px;
  }
  .veredicto.bien{color:var(--ok)}
  .veredicto.mal{color:var(--mal)}
  .respuesta{margin:0 0 10px}
  .respuesta strong{color:var(--acento)}
  .bloque{margin:0 0 10px;font-size:15px}
  .bloque .rot{
    font-family:'Segoe UI',sans-serif;font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--tenue);display:block;margin-bottom:2px;
  }
  .pie{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px;flex-wrap:wrap}
  .ref{font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--tenue)}

  .resumen{background:var(--panel);border:1px solid var(--borde);border-radius:4px;padding:26px}
  .resumen h2{font-size:20px;color:var(--titulo);font-weight:normal;margin:0 0 6px}
  .puntaje{font-size:40px;color:var(--acento);margin:12px 0 4px}
  .resumen table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14.5px}
  .resumen th,.resumen td{border-bottom:1px solid var(--borde);padding:8px 6px;text-align:left}
  .resumen th{
    font-family:'Segoe UI',sans-serif;font-size:11.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--tenue);background:var(--borde);font-weight:600;
  }
  .resumen td.n{text-align:right;font-family:'Segoe UI',sans-serif}
  .flojo{color:var(--mal)}

  .flash .enunciado{font-size:16.5px}
  .revelado{display:none}
  .revelado.visible{display:block}
  .aviso{
    font-family:'Segoe UI',sans-serif;font-size:12.5px;color:var(--tenue);
    background:var(--borde);padding:11px 14px;border-radius:3px;margin-bottom:16px;
  }
  .amp{overflow-x:auto;font-size:14.5px}
  .amp table{width:100%;border-collapse:collapse;font-size:13.5px;margin:9px 0;min-width:420px}
  .amp th,.amp td{border:1px solid var(--borde);padding:6px 9px;text-align:left;vertical-align:top}
  .amp th{
    background:var(--borde);font-family:'Segoe UI',sans-serif;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--titulo);font-weight:600;
  }
  .amp ol,.amp ul{margin:7px 0 7px 20px;padding:0}
  .amp li{margin-bottom:4px}
  .amp p{margin:7px 0}
  .amp blockquote{
    margin:9px 0;padding:9px 15px;border-left:3px solid var(--acento);
    background:var(--fondo);font-style:italic;
  }
  .amp em.dato{font-style:normal;background:#F0EDE7;padding:0 4px;border-radius:2px}
  .endef{background:#F4F2EC;border-left:3px solid var(--acento);
    padding:11px 15px;border-radius:0 3px 3px 0;font-size:15px}
  .endef .rot{margin-bottom:3px}
  /* ---------- Índice de temas ---------- */
  .arbol{display:flex;flex-direction:column;gap:2px}
  .arbol button{font-family:'Segoe UI',Helvetica,Arial,sans-serif;cursor:pointer;
    border:none;background:none;color:var(--texto);width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    text-align:left;border-radius:4px;padding:7px 10px;line-height:1.35}
  .arbol button:hover{background:#F2F0EC}
  .arbol button[aria-pressed="true"]{background:var(--acento);color:#fff}
  .arbol button span:first-child{min-width:0}
  .der{display:flex;align-items:center;gap:7px;flex-shrink:0;align-self:center}
  .arbol em{display:inline-flex;align-items:center;justify-content:center;align-self:center;max-height:18px;height:18px;line-height:18px;box-sizing:border-box;font-style:normal;
    text-align:center;border-radius:9px;flex-shrink:0;font-size:10.5px;
    background:var(--borde);color:var(--tenue);padding:0 7px;min-width:26px}
  .est{display:inline-flex;align-items:center;justify-content:center;align-self:center;max-height:18px;height:18px;line-height:18px;box-sizing:border-box;font-style:normal;
    text-align:center;border-radius:9px;flex-shrink:0;font-size:10.5px;
    font-weight:600;padding:0 7px;min-width:40px}
  .est.alto{background:#DCEBE2;color:#1F5137}
  .est.medio{background:#E8EFE9;color:#2D4A3E}
  .est.bajo{background:#F5EAD8;color:#7A5A22}
  .est.mal{background:#F7E2E2;color:#8C2F2F}
  .est.vacio{background:transparent;color:#C4C0BC;border:1px dashed var(--borde);font-weight:normal}
  .est.parcial::after{content:"·";margin-left:3px;opacity:.6}
  .arbol button[aria-pressed="true"] em,
  .arbol button[aria-pressed="true"] .est{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.35)}
  .rama.todo{font-size:13.5px;font-weight:600;margin-bottom:14px;box-shadow:inset 0 0 0 1px var(--borde)}
  .rama.todo[aria-pressed="true"]{box-shadow:none}
  .modulo{margin-top:13px}
  .modulo.plano{margin-top:18px;padding-top:13px;border-top:1px solid var(--borde)}
  .tronco{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--tenue)}
  .modulo.conhijo .tronco{color:var(--acento)}
  .tronco[aria-pressed="true"]{color:#fff}
  .hojas{margin:3px 0 0 10px;padding-left:12px;border-left:1px solid var(--borde);
    display:flex;flex-direction:column;gap:1px}
  .hojas.sinlinea{border-left:none;margin-left:0;padding-left:0}
  .hoja{font-size:12.5px}
  .rotgrupo{font-family:'Segoe UI',sans-serif;font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--tenue);margin-bottom:5px;font-weight:600;padding-left:10px}
  .pieArbol{display:flex;flex-direction:column;align-items:flex-start;gap:9px;
    margin-top:20px;padding-top:13px;border-top:1px solid var(--borde);
    font-family:'Segoe UI',sans-serif;font-size:11px;color:var(--tenue)}
  .pieArbol button{background:none;border:none;color:var(--acento);cursor:pointer;
    font-family:'Segoe UI',sans-serif;font-size:11.5px;text-decoration:underline;padding:0;width:auto}
  .leyenda{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .leyenda span{display:inline-flex;align-items:center;gap:6px}
  .leyenda i{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
  .barra-modo{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
  .modo{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;
    padding:8px 12px;border:1px solid var(--borde);background:#fff;
    color:var(--titulo);border-radius:3px;cursor:pointer;text-align:left;width:100%}
  .modo[aria-pressed="true"]{background:var(--acento);color:#fff;border-color:var(--acento)}

  .metaFila{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px}
  .metaFila .meta{margin-bottom:0;padding-top:2px}
  .flag{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11.5px;
    background:none;border:1px solid var(--borde);color:var(--tenue);
    border-radius:14px;padding:4px 11px;cursor:pointer;flex-shrink:0;
    display:inline-flex;align-items:center;gap:6px;line-height:1}
  .flag:hover{border-color:#C9C6C3;color:var(--titulo)}
  .flag b{font-size:13px;line-height:1;font-weight:normal}
  .flag[aria-pressed="true"]{background:#F6EEE2;border-color:#D9BE86;color:#7A5A22;font-weight:600}
  .est.marcadas{background:#F6EEE2;color:#7A5A22;border:none}
  /* ---------- Menú fijado ---------- */
  body.fijo{padding-left:340px}
  body.fijo .panel{transform:none;box-shadow:none}
  body.fijo .fondo{display:none}
  body.fijo .burger{display:none}
  .accionesPanel{display:flex;align-items:center;gap:2px;flex-shrink:0}
  .fijarPanel{background:none;border:none;color:var(--tenue);cursor:pointer;
    font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;
    letter-spacing:.05em;text-transform:uppercase;font-weight:600;
    padding:4px 8px;border-radius:3px;display:inline-flex;align-items:center;gap:5px}
  .fijarPanel:hover{background:#F2F0EC;color:var(--titulo)}
  .fijarPanel[aria-pressed="true"]{background:#E8EFE9;color:var(--acento)}
  .fijarPanel b{font-size:12px;font-weight:normal;line-height:1}
  @media (max-width:1024px){
    body.fijo{padding-left:0}
    body.fijo .panel{transform:translateX(-101%)}
    body.fijo .panel.abierto{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.14)}
    body.fijo .fondo{display:block}
    body.fijo .burger{display:inline-flex}
    .fijarPanel{display:none}
  }
  .accionesFin{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  /* ---------- Siguiente flotante ---------- */
  .flot{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:25;
    display:none;flex-direction:column;align-items:center;gap:3px;
    font-family:'Segoe UI',Helvetica,Arial,sans-serif;cursor:pointer;
    background:var(--acento);color:#fff;border:none;border-radius:6px;
    padding:16px 18px;box-shadow:0 3px 16px rgba(45,74,62,.28)}
  .flot.visible{display:inline-flex}
  .flot:hover{background:#243B31}
  .flot b{font-size:20px;line-height:1;font-weight:normal}
  .flot span{font-size:12.5px;font-weight:600;letter-spacing:.02em}
  .flot small{font-size:10px;opacity:.72;font-weight:normal;letter-spacing:.04em}
  @media (max-width:900px){
    .flot{right:14px;padding:13px 14px}
    .flot small{display:none}
  }
  .origen{border-radius:2px;padding:1px 6px}
  .origen.paquete{background:#E4EAE6;color:var(--acento)}
  .origen.propia{background:#EFE9DC;color:#6B5A32}
  .origen.catedra{background:#E4EAE6;color:var(--acento)}
  .origen.mixto,.origen.propio{background:#EFE9DC;color:#6B5A32}
  .origen.preguntero{background:#E3E8EE;color:#38506B}
  .origen.errado{background:#F7E2E2;color:#8C2F2F;font-weight:600}
  .nota100{
    font-family:'Segoe UI',sans-serif;font-size:13.5px;color:var(--titulo);
    border:1px solid var(--borde);border-radius:3px;padding:12px 15px;margin:16px 0 0;
  }
  .vacio{color:var(--tenue);font-style:italic;padding:30px 0;text-align:center}
  footer{margin-top:32px;font-family:'Segoe UI',sans-serif;font-size:12px;color:var(--tenue)}
  /* ================================================================
     Ajustes de interfaz - se agregan al final para pisar lo anterior
     ================================================================ */

  /* --- Titulos que respiran en pantallas chicas --- */
  header h1{font-size:clamp(20px,5.2vw,29px);line-height:1.22}
  header p{font-size:clamp(12.5px,3.2vw,14px)}
  @media (max-width:760px){
    header{margin-bottom:16px;text-align:left}
    .wrap{padding:18px 16px 124px}
  }

  /* --- Barra de estado pegada arriba, para no volver al inicio a cambiar de tema --- */
  .barraStick{margin-bottom:20px}
  .barraStick .progreso{margin-bottom:0}
  @media (max-width:760px){
    .barraStick{position:sticky;top:0;z-index:22;background:var(--fondo);
      margin:0 -16px 18px;padding:8px 16px 0}
    .barraSup{margin-bottom:8px;gap:10px}
    .estado{margin-bottom:0;font-size:12.5px;gap:10px}
  }

  /* --- El boton de temas ahora alterna, y se nota cuando el panel esta abierto --- */
  .burger{min-height:40px;transition:background .15s ease,border-color .15s ease,color .15s ease}
  .burger[aria-expanded="true"]{background:var(--acento);border-color:var(--acento);color:#fff}
  .burger .ham{position:relative;transition:box-shadow .18s ease,transform .18s ease}
  .burger[aria-expanded="true"] .ham{transform:rotate(45deg);box-shadow:none}
  .burger[aria-expanded="true"] .ham::after{content:"";position:absolute;inset:0;
    background:currentColor;border-radius:1px;transform:rotate(90deg)}

  /* --- Foco visible para teclado, sin ensuciar el clic con el mouse --- */
  .burger:focus-visible,.modo:focus-visible,.opcion:focus-visible,.btn:focus-visible,
  .flot:focus-visible,.flag:focus-visible,.arbol button:focus-visible,
  .cerrarPanel:focus-visible,.fijarPanel:focus-visible{
    outline:2px solid var(--acento);outline-offset:2px}

  /* --- Choque de nombres de clase ---
     El estado "no hay preguntas" usa .vacio con 30px de padding vertical, y las
     insignias del indice se llaman .est.vacio, asi que heredaban ese padding y
     pasaban de 18 a 62 px de alto. Cada leccion sin responder estiraba su fila y
     alargaba el indice, sobre todo en el telefono. */
  .est.vacio{padding:0 7px;font-style:normal;text-align:center}

  /* --- Panel lateral: mas comodo de tocar y con respiro abajo --- */
  .panel{padding-bottom:calc(26px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  body.sinScroll{overflow:hidden}
  @media (max-width:760px){
    .panel{width:min(88vw,330px);max-width:none}
    .arbol button{min-height:40px;padding:9px 10px}
    .modo{min-height:42px;padding:10px 12px}
    .panelTop{margin-bottom:14px}
    .cerrarPanel{font-size:20px;padding:6px 10px;min-height:40px}
  }

  /* --- Con el menu anclado, el texto no queda pegado al borde derecho --- */
  @media (min-width:1025px){
    body.fijo .wrap{max-width:900px;padding-left:34px;padding-right:34px}
  }

  /* --- Preguntas y respuestas: objetivos de toque mas grandes --- */
  @media (max-width:760px){
    .tarjeta,.resumen{padding:18px 16px 16px;border-radius:6px}
    .enunciado{font-size:16.5px}
    .opcion{padding:13px 14px;font-size:15.5px;min-height:48px;align-items:center}
    .metaFila{gap:10px}
    .meta{font-size:11px;letter-spacing:.04em}
    .flag{min-height:36px;padding:6px 12px}
    .texto-libre{flex-direction:column;align-items:stretch}
    .texto-libre input{min-width:0;width:100%}
    .texto-libre .btn{width:100%;min-height:46px}
    .pie{flex-direction:column;align-items:stretch;gap:10px}
    .pie .btn{width:100%;min-height:46px}
    .pie .ref{order:2;text-align:center}
    .accionesFin .btn{flex:1 1 auto;min-height:44px}
    .resumen table{font-size:13.5px}
    .puntaje{font-size:34px}
  }

  /* --- EL ARREGLO PRINCIPAL EN MOBILE ---
     Antes el boton Siguiente era un recuadro fijo a media altura y en pantallas
     angostas caia justo encima del enunciado. Ahora es una barra al pie: nunca
     tapa texto y queda siempre al alcance del pulgar. */
  @media (max-width:760px){
    .flot{
      position:fixed;left:0;right:0;bottom:0;top:auto;transform:none;
      width:100%;border-radius:0;flex-direction:row;justify-content:center;
      align-items:center;gap:10px;
      padding:15px 16px calc(15px + env(safe-area-inset-bottom));
      box-shadow:0 -2px 16px rgba(26,26,26,.18);
    }
    .flot.visible{display:flex}
    .flot b{font-size:18px}
    .flot span{font-size:15px}
    .flot small{display:none}
  }
  /* En escritorio se queda al costado, pero sin pisar la columna de texto. */
  @media (min-width:761px){
    .flot{right:max(18px,calc((100vw - 1080px)/2 - 96px))}
  }
  @media (min-width:1025px){
    body.fijo .flot{right:max(18px,calc((100vw - 340px - 900px)/2 - 96px))}
  }
</style>

<script>
/* ---------- Banco 1: autoevaluación, sección 9 del paquete ---------- */
const QUIZ = [
{n:1,mod:"01",lec:"L1",tema:"Paradigmas y cuadrantes",nivel:"recordar",tipo:"mc",
 q:"¿Cuál de los siguientes enfoques considera la cátedra el más general y el mejor alineado con el avance científico?",
 op:["Sistemas que piensan como humanos","Sistemas que actúan como humanos","Sistemas que piensan racionalmente","Sistemas que actúan racionalmente"],
 ok:3,
 just:"Define con claridad la norma de la racionalidad. Russell y Norvig definen la IA como el estudio y construcción de agentes racionales.",
 dist:"El par que la cátedra usa para armar opciones incorrectas es piensan contra actúan. El corte no está en el resultado sino en si se modela el proceso mental o solo la conducta observable.",
 ref:"M01 L1"},

{n:2,mod:"01",lec:"L1",tema:"Paradigmas y cuadrantes",nivel:"comprender",tipo:"mc",
 q:"En el paradigma subsimbólico, el conocimiento se representa de forma:",
 op:["Explícita, en bases estructuradas y reglas lógicas","Opaca, codificada en los parámetros del modelo","Explícita e implícita a la vez","Mediante procedimientos auditables paso a paso"],
 ok:1,
 just:"En el subsimbólico el conocimiento queda codificado en los parámetros, y de ahí su debilidad en interpretabilidad.",
 dist:"La opción a describe al paradigma simbólico y la d también, porque la transparencia y el razonamiento auditable son la fortaleza del simbólico. La c describe al híbrido.",
 ref:"M01 L1"},

{n:3,mod:"01",lec:"L1",tema:"Paradigmas y cuadrantes",nivel:"comprender",tipo:"vf",
 q:"El Test de Turing corresponde al cuadrante de los sistemas que piensan como humanos.",
 op:["Verdadero","Falso"],
 ok:1,
 just:"Pertenece a los sistemas que actúan como humanos, porque evalúa la conducta observable y no el proceso mental.",
 dist:"Es la confusión que la cátedra usa con más frecuencia. Piensan como humanos es ciencia cognitiva, introspección y experimentos psicológicos. Actúan como humanos es Test de Turing y chatbots.",
 ref:"M01 L1"},

{n:4,mod:"01",lec:"L1",tema:"Paradigmas y cuadrantes",nivel:"recordar",tipo:"mc",
 q:"¿Cuál de las siguientes <b>no</b> es uno de los cinco atributos que distinguen a un agente de un programa convencional?",
 op:["Control autónomo","Persistencia durante períodos prolongados","Autoconciencia de sus propios estados internos","Capacidad para alcanzar objetivos diferentes"],
 ok:2,
 just:"Los cinco son control autónomo, percepción del entorno, persistencia, adaptación y capacidad de alcanzar objetivos diferentes.",
 dist:"La autoconciencia pertenece a la IA fuerte, que para la cátedra es una concepción teórica sin ejemplos existentes.",
 ref:"M01 L1"},

{n:5,mod:"01",lec:"L2",tema:"Big data",nivel:"comprender",tipo:"mc",
 q:"Según la definición de Casas Roma y otros, el big data se caracteriza porque:",
 op:["Supera un umbral de un petabyte de almacenamiento","No puede ser tratado de forma eficiente por un sistema tradicional de análisis","Requiere obligatoriamente infraestructura en la nube","Proviene exclusivamente de sensores y redes sociales"],
 ok:1,
 just:"La definición se apoya en una incapacidad de los sistemas tradicionales, no en una cifra ni en una tecnología.",
 dist:"Las opciones a y c fijan un umbral o una tecnología. La d lleva el adverbio absoluto exclusivamente, que en las tres instancias evaluadas marcó siempre la opción falsa.",
 ref:"M01 L2"},

{n:6,mod:"01",lec:"L2",tema:"Big data",nivel:"aplicar",tipo:"mc",
 q:"Una empresa almacena correos de atención al cliente, con campos de remitente y asunto definidos y un cuerpo de texto libre. Ese contenido se clasifica como dato:",
 op:["Estructurado","Semiestructurado","No estructurado","Estructurado en los campos y no estructurado en el cuerpo, sin categoría única"],
 ok:1,
 just:"Es el ejemplo canónico de dato semiestructurado.",
 dist:"La opción d es un distractor por sobreanálisis. La cátedra separa semiestructurado de no estructurado con este mismo par: un correo es semiestructurado, una publicación de red social es no estructurada.",
 ref:"M01 L2"},

{n:7,mod:"01",lec:"L2",tema:"Big data",nivel:"recordar",tipo:"texto",
 q:"El modelo de las tres V fue formulado en 2001 por __________, analista de META Group.",
 acepta:["doug laney","laney","douglas laney"],
 sol:"Doug Laney",
 just:"META Group, 2001, con volumen, velocidad y variedad. Veracidad y valor se agregan más tarde.",
 dist:"Si la consigna pregunta por características del big data y aparece valor, entra. Reducir el big data al volumen está desmentido tres veces en M01 L2.",
 ref:"M01 L2"},

{n:8,mod:"01",lec:"L3",tema:"Machine y deep learning",nivel:"aplicar",tipo:"mc",
 q:"Un supermercado procesa miles de transacciones y descubre que quien compra pan también lleva leche en el 75 % de los casos, sin haber definido previamente esa relación. El tipo de aprendizaje aplicado es:",
 op:["Supervisado, tarea de clasificación","Supervisado, tarea de regresión","No supervisado","Por refuerzo"],
 ok:2,
 just:"No hay etiquetas ni categorías predefinidas, el algoritmo descubre la asociación. Es el ejemplo textual de la cátedra.",
 dist:"Clasificación y regresión no son tipos de aprendizaje, son dos tareas dentro del supervisado. Agrupar es no supervisado y descubre los grupos, clasificar es supervisado y asigna a categorías conocidas.",
 ref:"M01 L3"},

{n:9,mod:"01",lec:"L3",tema:"Machine y deep learning",nivel:"comprender",tipo:"mc",
 q:"La diferencia estructural que define al aprendizaje profundo frente a una red neuronal tradicional es:",
 op:["La cantidad de datos de entrenamiento disponibles","El uso de GPU en lugar de equipos convencionales","La existencia de múltiples capas ocultas","La aplicación a problemas de visión por computadora"],
 ok:2,
 just:"La definición es estructural. Las otras tres son consecuencias o condiciones habilitantes.",
 dist:"El error clásico es leer el deep learning como una red con muchos datos. Los datos y la GPU habilitan, no definen.",
 ref:"M01 L3"},

{n:10,mod:"01",lec:"L3",tema:"Machine y deep learning",nivel:"recordar",tipo:"vf",
 q:"Los <i>Transformers</i> son la única aproximación posible a los sistemas de IA generativa.",
 op:["Verdadero","Falso"],
 ok:1,
 just:"El PDF lo aclara en recuadro: habilitan los avances en lenguaje, pero no son la única aproximación generativa.",
 dist:"Es uno de los cuatro puntos que la cátedra desmiente más de una vez, y la palabra única basta para descartarla por el patrón de los absolutos.",
 ref:"M01 L3"},

{n:11,mod:"01",lec:"L3",tema:"Machine y deep learning",nivel:"recordar",tipo:"mc",
 q:"En la línea de tiempo de las redes neuronales, el año 1958 corresponde a:",
 op:["Los primeros modelos conceptuales de McCulloch y Pitts","El perceptrón de Rosenblatt","El algoritmo de retropropagación","El salto al aprendizaje profundo"],
 ok:1,
 just:"1943 McCulloch y Pitts, 1958 el perceptrón, década de 1980 la retropropagación, década de 2010 el deep learning.",
 dist:"El perceptrón es conexionista y aprende de ejemplos. Tomarlo por un sistema simbólico es otro par que la cátedra usa para armar opciones incorrectas.",
 ref:"M01 L3"},

{n:12,mod:"01",lec:"L4",tema:"Visión artificial",nivel:"aplicar",tipo:"mc",
 q:"Un sistema de vigilancia debe identificar simultáneamente personas, automóviles y bicicletas en una misma imagen, indicando la posición de cada uno. La tarea y la arquitectura adecuadas son:",
 op:["Clasificación de imágenes con una CNN","Detección y localización de objetos con YOLO o Faster R-CNN","Creación de imágenes con GAN","Recomendación de imágenes por similitud del coseno"],
 ok:1,
 just:"Múltiples objetos con su ubicación es detección y localización. La clasificación asigna un solo objeto a una categoría predefinida.",
 dist:"Las GAN son generativas y quedan expresamente fuera de la etapa de clasificación. YOLO hace detección, nunca clasificación pura. En M01 L4 la Figura 3 está mal titulada justo sobre esta distinción.",
 ref:"M01 L4"},

{n:13,mod:"01",lec:"L4",tema:"Visión artificial",nivel:"recordar",tipo:"texto2",
 q:"En una imagen en escala de grises, el valor 0 corresponde a __________ y el valor 255 a __________.",
 acepta:["negro","negro absoluto"],
 acepta2:["blanco","blanco puro"],
 sol:"Negro absoluto y blanco puro",
 just:"El valor 128 corresponde al gris medio.",
 dist:"En RGB la cátedra escribe (255,0,0) rojo, (0,0,255) azul, (255,255,255) blanco y (0,0,0) negro.",
 ref:"M01 L4"},

{n:14,mod:"01",lec:"L4",tema:"Visión artificial",nivel:"comprender",tipo:"mc",
 q:"Respecto de los dos modos de reconocimiento facial, es correcto afirmar que:",
 op:["La verificación compara con muchas imágenes y tiene mayor complejidad computacional","La identificación compara con una sola imagen y responde si es quien dice ser","La identificación compara con muchas imágenes y tiene mayor complejidad computacional","Los dos modos tienen la misma complejidad y difieren solo en el ámbito de uso"],
 ok:2,
 just:"Identificación es uno contra muchos y es la más costosa. Verificación es uno contra uno.",
 dist:"Las opciones a y b son el mismo contenido con los nombres cruzados. La d cierra con solo, adverbio absoluto.",
 ref:"M01 L4"},

{n:15,mod:"01",lec:"L4",tema:"Visión artificial",nivel:"comprender",tipo:"mc",
 q:"El aprendizaje de extremo a extremo significa que:",
 op:["El modelo se entrena desde el primer píxel hasta la última capa sin interrupciones","La extracción de características y la clasificación ocurren en un único sistema optimizado en conjunto","El sistema no necesita datos etiquetados","Las GAN participan de la etapa de clasificación"],
 ok:1,
 just:"Es lo que distingue al aprendizaje profundo del enfoque tradicional, donde extracción y clasificación están separadas.",
 dist:"La opción a suena bien pero describe una continuidad de capas. El aprendizaje profundo no elimina la necesidad de datos etiquetados en clasificación supervisada, la aumenta.",
 ref:"M01 L4"},

{n:16,mod:"02",lec:"L1",tema:"Fundamentos disciplinarios",nivel:"recordar",tipo:"mc",
 q:"La introducción de variables, cuantificadores y funciones en la lógica formal corresponde a:",
 op:["Boole","Frege","Aristóteles","Church"],
 ok:1,
 just:"Boole hace álgebra proposicional. Frege agrega variables, cuantificadores y funciones.",
 dist:"Boole y Frege son un par fijo de la cátedra. Aristóteles aporta la raíz de la lógica formal del enfoque piensan racionalmente.",
 ref:"M02 L1"},

{n:17,mod:"02",lec:"L1",tema:"Fundamentos disciplinarios",nivel:"comprender",tipo:"mc",
 q:"Con el problema de la parada, Turing demostró que:",
 op:["Algunos programas requieren demasiado tiempo de cómputo para ser prácticos","No existe un verificador universal capaz de determinar si cualquier programa terminará","Las máquinas no pueden simular el razonamiento humano","La lógica de predicados es incompleta"],
 ok:1,
 just:"Es un resultado de no computabilidad demostrado por contradicción, no una cuestión de costo.",
 dist:"La opción a lo convierte en un problema caro. La cátedra separa expresamente el problema de la parada de un problema difícil.",
 ref:"M02 L1"},

{n:18,mod:"02",lec:"L1",tema:"Fundamentos disciplinarios",nivel:"recordar",tipo:"texto",
 q:"El concepto de racionalidad limitada, que propone buscar soluciones lo suficientemente buenas en lugar de óptimas, corresponde a __________.",
 acepta:["herbert simon","simon","h. simon","herbert a. simon"],
 sol:"Herbert Simon",
 just:"Es criterio de diseño, no limitación de hardware. Atraviesa desde la planificación heurística hasta el aprendizaje profundo.",
 dist:"No confundir con el límite de la memoria de trabajo de Miller, alrededor de siete elementos, que viene de psicología.",
 ref:"M02 L1"},

{n:19,mod:"02",lec:"L1",tema:"Fundamentos disciplinarios",nivel:"recordar",tipo:"mc",
 q:"El modelo matemático de neurona artificial capaz de realizar operaciones lógicas básicas fue descrito en 1943 por:",
 op:["Rosenblatt","Rumelhart, Hinton y Williams","McCulloch y Pitts","Ramón y Cajal"],
 ok:2,
 just:"McCulloch era neurofisiólogo y Pitts matemático autodidacta.",
 dist:"Rosenblatt es el perceptrón de 1958. Rumelhart, Hinton y Williams son la retropropagación de 1986. Los tres nombres cubren tres fechas distintas de la misma línea de tiempo.",
 ref:"M02 L1"},

{n:20,mod:"02",lec:"L2",tema:"Orígenes y cronología",nivel:"comprender",tipo:"mc",
 q:"El nacimiento formal de la inteligencia artificial como disciplina se ubica en:",
 op:["1950, con el artículo de Turing en la revista <i>Mind</i>","1956, con la conferencia de Dartmouth organizada por McCarthy","1958, con el perceptrón de Rosenblatt","1959, con el programa de damas de Samuel"],
 ok:1,
 just:"Turing publica el test en 1950, pero el nacimiento formal es Dartmouth en 1956, donde McCarthy acuña el término.",
 dist:"1950 contra 1956 es el par más usado de la lección. El término inteligencia artificial lo acuña McCarthy, no Turing.",
 ref:"M02 L2"},

{n:21,mod:"02",lec:"L2",tema:"Orígenes y cronología",nivel:"comprender",tipo:"vf",
 q:"<i>Perceptrons</i>, de Minsky y Papert, demostró que las redes neuronales no pueden resolver problemas no linealmente separables.",
 op:["Verdadero","Falso"],
 ok:1,
 just:"Demostró la limitación de los perceptrones de una sola capa. La retropropagación de 1986 resuelve el caso multicapa.",
 dist:"La afirmación borra la condición de una sola capa y convierte un resultado acotado en una imposibilidad general.",
 ref:"M02 L2"},

{n:22,mod:"02",lec:"L2",tema:"Orígenes y cronología",nivel:"recordar",tipo:"mc",
 q:"Los tres factores que explican el éxito de AlexNet en 2012 son:",
 op:["Transformers, big data y computación en la nube","ReLU, GPU y grandes conjuntos de datos etiquetados","Retropropagación, TPU y aprendizaje por refuerzo","Redes convolucionales, <i>dropout</i> y normalización por lotes"],
 ok:1,
 just:"Avances algorítmicos con ReLU, uso de GPU y disponibilidad de conjuntos etiquetados como ImageNet.",
 dist:"AlexNet baja el error del 25 % al 15,4 % en ImageNet. Los Transformers son posteriores y no explican 2012.",
 ref:"M02 L2"},

{n:23,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"comprender",tipo:"mc",
 q:"¿Cuál de los siguientes <b>no</b> es uno de los cinco componentes del espacio de estados?",
 op:["Función sucesora","Función heurística","Operadores o acciones","Estados objetivo"],
 ok:1,
 just:"Los cinco son estados individuales, estado inicial, estados objetivo, operadores y función sucesora.",
 dist:"La función heurística pertenece a la búsqueda informada, no al espacio de estados. Es el componente falso que más se cuela porque comparte la palabra función con la sucesora.",
 ref:"M02 L3"},

{n:24,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"comprender",tipo:"vf",
 q:"La búsqueda de costo uniforme se clasifica entre las búsquedas informadas, porque incorpora conocimiento del dominio.",
 op:["Verdadero","Falso"],
 ok:1,
 just:"Es no informada. Usa costos reales acumulados, no estimaciones del dominio.",
 dist:"El costo acumulado no es conocimiento del dominio. Lo informado exige una estimación hacia el objetivo, que es lo que aportan la voraz y A*.",
 ref:"M02 L3"},

{n:25,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"comprender",tipo:"mc",
 q:"El algoritmo A* garantiza encontrar la solución óptima cuando:",
 op:["El espacio de estados es finito","La heurística es admisible, es decir cuando no sobreestima el costo real","Todos los costos de las acciones son iguales","Siempre, por combinar costo acumulado con estimación al objetivo"],
 ok:1,
 just:"Sin heurística admisible la afirmación de optimalidad es falsa.",
 dist:"La opción c describe la condición de BFS. La d lleva el absoluto siempre, que en las tres instancias evaluadas nunca fue correcto.",
 ref:"M02 L3"},

{n:26,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"aplicar",tipo:"mc",
 q:"Un sistema detecta un aumento súbito de reclamos y propone como causa probable una falla en el último despliegue, hipótesis que después habrá que verificar. El tipo de razonamiento aplicado es:",
 op:["Deductivo","Inductivo","Abductivo","Analógico"],
 ok:2,
 just:"Va de un hecho observado a la explicación más plausible y genera una hipótesis a verificar.",
 dist:"El inductivo generalizaría un patrón desde casos repetidos. El deductivo aplicaría una regla general a un caso concreto. Contestar inductivo donde va abductivo es la trampa registrada en la autoevaluación del módulo 02.",
 ref:"M02 L3"},

{n:27,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"aplicar",tipo:"mc",
 q:"Un asistente debe interpretar la nota de un profesional donde un mismo término técnico cambia de sentido según el servicio que lo escribió. El nivel de análisis lingüístico requerido es:",
 op:["Morfológico","Sintáctico","Semántico","Pragmático"],
 ok:3,
 just:"El significado depende del contexto de quien escribe. El semántico alcanzaría para una consulta directa.",
 dist:"Este par ya se tomó dos veces con respuesta distinta. Consulta de un paciente lleva a semántico, nota profesional en contexto clínico lleva a pragmático. Mirar quién escribe y con qué intención.",
 ref:"M02 L3"},

{n:28,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"aplicar",tipo:"mc",
 q:"Una partida de ajedrez con límite de tiempo constituye, según la clasificación de entornos de tarea, un entorno:",
 op:["Estático","Dinámico","Semidinámico","Episódico"],
 ok:2,
 just:"El entorno no cambia mientras el agente delibera pero su rendimiento sí. Es el único de los seis pares con tres valores.",
 dist:"Episódico y estático son propiedades distintas. Episódico es que las experiencias son independientes entre sí, estático es que el entorno no cambia mientras el agente delibera.",
 ref:"M02 L4"},

{n:29,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"aplicar",tipo:"mc",
 q:"Un sistema debe recomendar un tratamiento equilibrando eficacia clínica, efectos secundarios y costo, tres criterios que compiten entre sí. El tipo de agente adecuado es:",
 op:["Reactivo simple","Reactivo basado en modelo","Basado en objetivos","Basado en utilidad"],
 ok:3,
 just:"Los objetivos en conflicto exigen una función de utilidad.",
 dist:"El basado en objetivos razona en lógica de alcanzar o no la meta y no puede ponderar criterios que compiten. El agente basado en utilidad apareció tres veces en las 28 preguntas ya tomadas.",
 ref:"M02 L4"},

{n:30,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"comprender",tipo:"vf",
 q:"La función de agente y el programa de agente son dos nombres para el mismo concepto.",
 op:["Verdadero","Falso"],
 ok:1,
 just:"La función es el mapeo teórico de toda secuencia de percepciones a una acción. El programa es el código concreto.",
 dist:"La ecuación de la cátedra es agente igual a arquitectura más programa. La función no aparece en esa ecuación porque es el concepto teórico, no una pieza del sistema.",
 ref:"M02 L4"},

/* --- Preguntas escritas sobre el material, fuera de la sección 9 --- */

{n:101,mod:"01",lec:"L1",tema:"Paradigmas y cuadrantes",nivel:"comprender",tipo:"mc",src:"propia",
 q:"Respecto de la IA débil y la IA fuerte, es correcto afirmar que:",
 op:["La IA fuerte ya tiene aplicaciones funcionando en los asistentes virtuales actuales","La IA fuerte es una concepción teórica de máquinas con comprensión y autoconciencia genuinas, sin ejemplos existentes","La IA débil incluye la autoconciencia pero en grado reducido","AlphaGo es el primer caso documentado de IA fuerte"],
 ok:1,
 just:"La IA fuerte es horizonte de investigación y debate filosófico. La cátedra la presenta sin ejemplos.",
 dist:"La opción d usa AlphaGo, que técnicamente es IA débil por estar diseñado para una tarea específica, aunque exhibió capacidades que se acercaban al territorio conceptual de la fuerte. Dar por sentado que la fuerte existe en alguna forma reducida es la trampa que marca la lección.",
 ref:"M01 L1"},

{n:102,mod:"01",lec:"L1",tema:"Paradigmas y cuadrantes",nivel:"comprender",tipo:"mc",src:"propia",
 q:"Un sistema califica como híbrido, según la definición de la cátedra, cuando:",
 op:["Usa varias técnicas de aprendizaje automático combinadas","Combina representación simbólica explícita con aprendizaje subsimbólico","Emplea más de un tipo de red neuronal en la misma arquitectura","Alterna el procesamiento entre GPU y equipos convencionales"],
 ok:1,
 just:"La híbrida o neuro-simbólica combina las dos formas de representar el conocimiento, y su fortaleza es potencia con interpretabilidad.",
 dist:"La opción a es el error más común: suponer que híbrida significa usar varias técnicas. La definición exige las dos representaciones, no dos algoritmos.",
 ref:"M01 L1"},

{n:103,mod:"01",lec:"L1",tema:"Paradigmas y cuadrantes",nivel:"recordar",tipo:"texto",src:"propia",
 q:"La palabra <i>robot</i> aparece en 1920, en la obra teatral <i>R.U.R.</i>, del checo __________.",
 acepta:["karel capek","capek","karel čapek","čapek"],
 sol:"Karel Čapek",
 just:"Deriva de robota, trabajo forzado o servidumbre. La obra instaló además el arquetipo de la rebelión de las máquinas.",
 dist:"No confundir con Asimov, que formula las Tres Leyes de la Robótica en 1942, en el relato Runaround. Lo evaluable de las Tres Leyes es el orden de prioridad entre ellas, no el texto exacto.",
 ref:"M01 L1"},

{n:104,mod:"01",lec:"L2",tema:"Big data",nivel:"comprender",tipo:"mc",src:"propia",
 q:"La inexactitud, los duplicados, la información incompleta, las inconsistencias internas y los valores atípicos no representativos son las cinco formas de ausencia de:",
 op:["Volumen","Velocidad","Veracidad","Valor"],
 ok:2,
 just:"La veracidad es la calidad y confiabilidad del dato, y esas cinco son sus formas de ausencia.",
 dist:"Es donde más pega el vocabulario de trabajo. Lo que en el trabajo se llama data quality o data profiling acá es veracidad, una de las cinco V, no una disciplina con herramientas propias. Y outlier acá es valor atípico, dentro de veracidad.",
 ref:"M01 L2"},

{n:105,mod:"01",lec:"L2",tema:"Big data",nivel:"recordar",tipo:"mc",src:"propia",
 q:"¿Cuál de los siguientes <b>no</b> es uno de los cuatro modos de procesamiento asociados a la velocidad?",
 op:["Tiempo real","Por lotes programados","Flujo continuo","Descriptivo"],
 ok:3,
 just:"Los cuatro modos son tiempo real, por lotes programados, flujo continuo e híbrido.",
 dist:"Descriptivo es uno de los cinco tipos de análisis que pertenecen a la V de valor, junto con predictivo, prescriptivo, simulación y visualización. El ítem cruza dos V a propósito.",
 ref:"M01 L2"},

{n:106,mod:"01",lec:"L2",tema:"Big data",nivel:"recordar",tipo:"texto",src:"propia",
 q:"El término <i>internet de las cosas</i> lo acuña en 1999 __________, investigador del MIT, mientras trabajaba para Procter & Gamble.",
 acepta:["kevin ashton","ashton"],
 sol:"Kevin Ashton",
 just:"Los cuatro datos son preguntables por separado: el nombre, el año 1999, el MIT y Procter & Gamble.",
 dist:"No confundir con Doug Laney, que es META Group y 2001, y corresponde a las tres V del big data.",
 ref:"M01 L2"},

{n:107,mod:"01",lec:"L2",tema:"Big data",nivel:"comprender",tipo:"mc",src:"propia",
 q:"Respecto del <i>edge computing</i> frente al <i>cloud computing</i>, es correcto afirmar que:",
 op:["Tiene mayor capacidad de procesamiento porque está más cerca del dato","Tiene baja latencia y capacidad limitada, y procesa cerca del origen del dato","Reemplaza a la nube en todos los escenarios industriales","Sirve principalmente para almacenamiento a largo plazo"],
 ok:1,
 just:"Procesa cerca del origen, con latencia baja que permite respuesta en tiempo real, pero con capacidad limitada.",
 dist:"Leer el edge como más potente es el error registrado: es lo contrario, menos capacidad y menos latencia. La respuesta que la cátedra da por correcta ante el dilema es la arquitectura híbrida, borde para el procesamiento inmediato y nube para el análisis profundo.",
 ref:"M01 L2"},

{n:108,mod:"01",lec:"L3",tema:"Machine y deep learning",nivel:"aplicar",tipo:"mc",src:"propia",
 q:"Predecir el precio de un automóvil a partir de sus características, con un conjunto de datos que ya trae los precios reales, es un caso de:",
 op:["Aprendizaje supervisado, tarea de clasificación","Aprendizaje supervisado, tarea de regresión","Aprendizaje no supervisado, detección de anomalías","Aprendizaje por refuerzo"],
 ok:1,
 just:"Hay etiquetas y la salida es un valor continuo. La clasificación predice una categoría discreta, la regresión un valor continuo.",
 dist:"Clasificación y regresión no son tipos de aprendizaje sino dos tareas dentro del supervisado. El ejemplo del precio del automóvil es el que usa la cátedra para regresión, y el filtro de correo no deseado para clasificación.",
 ref:"M01 L3"},

{n:109,mod:"01",lec:"L3",tema:"Machine y deep learning",nivel:"comprender",tipo:"mc",src:"propia",
 q:"El procesamiento jerárquico de una red convolucional ocurre en este orden:",
 op:["Objetos completos, luego partes de objetos, luego bordes y texturas simples","Bordes y texturas simples, luego partes de objetos, luego objetos completos","Partes de objetos, luego bordes y texturas, luego escenas completas","Todas las capas procesan el mismo nivel de detalle en paralelo"],
 ok:1,
 just:"Primeras capas con bordes y texturas simples, capas intermedias con formas y patrones compuestos, capas superiores con objetos completos o escenas.",
 dist:"El distractor fuerte, y el que la cátedra usó de hecho en la actividad práctica 1, es la misma frase con el orden invertido. Va de lo simple a lo complejo a medida que se profundiza.",
 ref:"M01 L3"},

{n:110,mod:"01",lec:"L3",tema:"Machine y deep learning",nivel:"comprender",tipo:"mc",src:"propia",
 q:"La diferencia que la cátedra marca entre IA generativa e IA tradicional es que:",
 op:["La generativa crea contenido nuevo, original y coherente, mientras la tradicional clasifica, identifica patrones y decide sobre datos existentes","La generativa no necesita datos de entrenamiento","La tradicional no utiliza redes neuronales","La generativa alcanza siempre mayor precisión"],
 ok:0,
 just:"El punto de inflexión que marca la cátedra es ChatGPT, a fines de 2022.",
 dist:"Las opciones b y d agregan afirmaciones que el material no sostiene, y la d lleva el absoluto siempre.",
 ref:"M01 L3"},

{n:111,mod:"01",lec:"L4",tema:"Visión artificial",nivel:"comprender",tipo:"mc",src:"propia",
 q:"La visión por computadora se define como un problema inverso porque:",
 op:["Invierte los valores de los píxeles antes de procesarlos","Reconstruye información tridimensional y contextual a partir de datos incompletos, que son una imagen bidimensional","Va de descripciones matemáticas a imágenes","Procesa la imagen desde la última capa hacia la primera"],
 ok:1,
 just:"Es la definición que abre la lección y la que hay que poder explicar en dos líneas.",
 dist:"La opción c describe a los gráficos por computadora, que son el proceso inverso: van de descripciones matemáticas a imágenes, es decir generan. La visión va de imágenes a comprensión del mundo, es decir interpreta.",
 ref:"M01 L4"},

{n:112,mod:"01",lec:"L4",tema:"Visión artificial",nivel:"aplicar",tipo:"mc",src:"propia",
 q:"Un sistema ajusta el brillo, el contraste y aplica filtros sobre una imagen antes de analizarla. Esa operación es:",
 op:["Visión por computadora","Procesamiento de imágenes","Percepción visual","Extracción de características"],
 ok:1,
 just:"Ajustar brillo, contraste y filtros es procesamiento de imágenes, una operación de bajo nivel. Interpretar el significado y el contexto es visión por computadora.",
 dist:"La otra distinción vecina es visión contra percepción visual. Capturar datos visuales es visión, darles sentido en un marco contextual es percepción visual: el vehículo autónomo no solo detecta al peatón, interpreta su velocidad, su dirección y sus intenciones.",
 ref:"M01 L4"},

{n:113,mod:"01",lec:"L4",tema:"Visión artificial",nivel:"recordar",tipo:"mc",src:"propia",
 q:"El sensor que emite pulsos láser para medir distancias y crear mapas tridimensionales es:",
 op:["El radar","La cámara hiperespectral","El LiDAR","La cámara térmica"],
 ok:2,
 just:"LiDAR usa pulsos láser. Radar usa ondas de radio para detectar objetos y velocidad, incluso con clima adverso.",
 dist:"LiDAR y radar son un par fijo de la cátedra. Las térmicas o infrarrojas captan radiación infrarroja, es decir calor, y permiten ver en oscuridad. Las hiperespectrales captan múltiples bandas del espectro electromagnético.",
 ref:"M01 L4"},

{n:114,mod:"02",lec:"L1",tema:"Fundamentos disciplinarios",nivel:"recordar",tipo:"mc",src:"propia",
 q:"¿Cuál de las siguientes <b>no</b> es uno de los ocho fundamentos disciplinarios de la IA?",
 op:["Economía","Teoría de control y cibernética","Lingüística","Termodinámica"],
 ok:3,
 just:"Los ocho, en el orden de la cátedra, son filosofía, matemáticas, economía, neurociencia, psicología, ingeniería informática, teoría de control y cibernética, y lingüística.",
 dist:"Teoría de control y cibernética cuentan como un solo fundamento, no como dos. Contarlos mal es lo que hace fallar los ítems de tipo indique cuántos.",
 ref:"M02 L1"},

{n:115,mod:"02",lec:"L1",tema:"Fundamentos disciplinarios",nivel:"recordar",tipo:"mc",src:"propia",
 q:"La teoría de la información, que conecta la lógica booleana con los circuitos eléctricos y define la entropía como medida de la incertidumbre promedio de una variable aleatoria, corresponde a:",
 op:["Shannon","Fisher","Bellman","Wiener"],
 ok:0,
 just:"Shannon lo plantea en su tesis de maestría de 1937.",
 dist:"Fisher aporta pruebas de hipótesis, análisis de varianza y diseño experimental. Bellman aporta programación dinámica y procesos de decisión de Markov. Wiener acuña cibernética y publica el libro homónimo en 1948.",
 ref:"M02 L1"},

{n:116,mod:"02",lec:"L2",tema:"Orígenes y cronología",nivel:"recordar",tipo:"mc",src:"propia",
 q:"¿Cuál de las siguientes <b>no</b> es una de las cuatro capacidades que un sistema necesita para superar el Test de Turing?",
 op:["Procesamiento del lenguaje natural","Representación del conocimiento","Razonamiento automático","Autoconciencia"],
 ok:3,
 just:"Las cuatro son PLN para comunicarse con fluidez, representación del conocimiento para almacenar información, conceptos y emociones simuladas, razonamiento automático para responder preguntas complejas, y aprendizaje automático para adaptarse.",
 dist:"La autoconciencia pertenece a la IA fuerte. El Test de Turing evalúa conducta observable y por eso no exige nada del estado interno del sistema.",
 ref:"M02 L2"},

{n:117,mod:"02",lec:"L2",tema:"Orígenes y cronología",nivel:"recordar",tipo:"mc",src:"propia",
 q:"El sistema experto que produjo un ahorro estimado de 40 millones de dólares anuales configurando computadoras para Digital Equipment Corporation fue:",
 op:["MYCIN","XCON","PROSPECTOR","DENDRAL"],
 ok:1,
 just:"XCON es el caso con el que la cátedra muestra que la IA se volvió rentable en la era de los sistemas expertos, 1980 a 1987.",
 dist:"MYCIN diagnostica infecciones bacterianas en Stanford y superó a médicos junior en algunas evaluaciones. PROSPECTOR es exploración geológica y ayudó a descubrir un depósito de molibdeno. DENDRAL es 1964, anterior, e identifica estructuras químicas orgánicas.",
 ref:"M02 L2"},

{n:118,mod:"02",lec:"L2",tema:"Orígenes y cronología",nivel:"comprender",tipo:"mc",src:"propia",
 q:"Deep Blue, que derrota a Kasparov en 1997, se apoyaba principalmente en:",
 op:["Procesamiento de lenguaje natural con base de conocimiento enorme","Fuerza bruta, evaluando millones de posiciones por segundo","Aprendizaje por refuerzo jugando contra sí mismo","Redes convolucionales entrenadas con partidas históricas"],
 ok:1,
 just:"La cátedra subraya el principalmente fuerza bruta.",
 dist:"La opción a describe a Watson, que gana Jeopardy! en 2011. La c describe a AlphaGo, que en 2016 derrota a Lee Sedol combinando aprendizaje supervisado de partidas humanas con refuerzo jugando contra sí mismo. Deep Blue y Watson son los dos de IBM y por eso se cruzan.",
 ref:"M02 L2"},

{n:119,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"recordar",tipo:"mc",src:"propia",
 q:"Según la tabla de áreas de aplicación, la robótica se caracteriza por ser:",
 op:["La fusión de lingüística, estadística y aprendizaje profundo","La síntesis de todas las áreas anteriores con ingeniería","La fusión de psicología de la percepción con procesamiento de señales","La fusión de filosofía y matemáticas"],
 ok:1,
 just:"La robótica cierra la lista de siete áreas como síntesis de todas las anteriores con ingeniería. Sus aplicaciones son robots industriales y drones de exploración espacial.",
 dist:"La opción a describe al PLN, la c a la visión por computadora y la d a búsqueda y planificación. Cada distractor es la fusión disciplinar de otra de las siete áreas.",
 ref:"M02 L3"},

{n:120,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"comprender",tipo:"mc",src:"propia",
 q:"La diferencia entre búsqueda y planificación es que:",
 op:["La búsqueda usa el espacio de estados y la planificación no","La búsqueda explora caminos y la planificación diseña una secuencia ordenada de acciones","La planificación solo se aplica a entornos deterministas","La búsqueda es informada y la planificación no informada"],
 ok:1,
 just:"La diferencia es de foco, no de marco. Las dos usan el espacio de estados.",
 dist:"La opción a es el error de fondo: supone que son marcos distintos. Este par ya se tomó dos veces con formato distinto, una como verdadero o falso y otra como elección múltiple.",
 ref:"M02 L3"},

{n:121,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"comprender",tipo:"vf",src:"propia",
 q:"En un sistema experto las reglas de la base de conocimientos se obtienen automáticamente a partir de los datos históricos del dominio.",
 op:["Verdadero","Falso"],
 ok:1,
 just:"Las reglas están explícitamente codificadas por expertos humanos. Eso es lo que separa al sistema experto de un modelo de aprendizaje automático.",
 dist:"La cátedra repite esa aclaración dos veces en el mismo apartado, y esa repetición suele anticipar la pregunta.",
 ref:"M02 L3"},

{n:122,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"recordar",tipo:"mc",src:"propia",
 q:"¿Cuál de los siguientes <b>no</b> es uno de los cinco niveles de análisis del PLN?",
 op:["Tokenización","Lematización","Análisis sintáctico","Análisis pragmático"],
 ok:1,
 just:"Los cinco niveles son tokenización, morfológico, sintáctico, semántico y pragmático.",
 dist:"La lematización pertenece al preprocesamiento, la etapa que los sistemas modernos agregan antes de la tokenización junto con la normalización y la eliminación de palabras irrelevantes. Es un nivel agregado, no uno de los cinco clásicos.",
 ref:"M02 L3"},

{n:123,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"comprender",tipo:"mc",src:"propia",
 q:"La descripción que corresponde a la búsqueda en profundidad es:",
 op:["Recorre todos los nodos de un nivel antes de pasar al siguiente","Recorre un camino hasta el final antes de retroceder, con menos memoria y sin garantía de optimalidad","Expande siempre el nodo de menor costo acumulado","Combina el costo acumulado con una estimación heurística al objetivo"],
 ok:1,
 just:"DFS usa menos memoria, no garantiza optimalidad y puede caer en caminos infinitos. La variante de profundidad limitada evita ese último problema.",
 dist:"La opción a es amplitud, la c es costo uniforme y la d es A*. Las cuatro descripciones son de la misma tabla, tres son de las otras filas.",
 ref:"M02 L3"},

{n:124,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"comprender",tipo:"vf",src:"propia",
 q:"La explosión combinatoria es un problema de hardware que se resuelve aumentando la capacidad de cómputo disponible.",
 op:["Verdadero","Falso"],
 ok:1,
 just:"Es el crecimiento exponencial de estados al aumentar las variables. Ningún poder de cómputo la resuelve por fuerza bruta, y por eso existen las heurísticas.",
 dist:"El cálculo del ajedrez es el argumento de la cátedra: factor de ramificación 35, árbol del orden de 35 elevado a 80, contra los 10 elevado a 80 átomos estimados del universo observable.",
 ref:"M02 L3"},

{n:125,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"comprender",tipo:"mc",src:"propia",
 q:"En el modelo PEAS aplicado al vehículo autónomo, el volante, el acelerador y el freno corresponden a la letra:",
 op:["P, de <i>performance</i>","E, de <i>environment</i>","A, de <i>actuators</i>","S, de <i>sensors</i>"],
 ok:2,
 just:"Los actuadores son cómo el agente actúa sobre el entorno. Las cámaras, el radar y el GPS serían los sensores.",
 dist:"Sensor y actuador es un par fijo de la cátedra: el sensor capta, el actuador ejecuta. Los actuadores son además el componente que suele olvidarse, y sin ellos el ciclo percepción-decisión-acción no se cierra.",
 ref:"M02 L4"},

{n:126,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"aplicar",tipo:"mc",src:"propia",
 q:"El error clásico al formular la medida de rendimiento de un sistema de riego inteligente es definirla como:",
 op:["Maximizar el volumen de agua distribuida","Mantener la humedad del suelo en el rango óptimo de cada planta","Minimizar la cantidad de sensores instalados","Equilibrar consumo de agua y estado de las plantas"],
 ok:0,
 just:"Maximizar el agua distribuida lleva a regar en exceso. La medida adecuada es mantener la humedad del suelo en el rango óptimo de cada planta.",
 dist:"El mismo error tiene su versión en el vehículo autónomo: valorar solo la velocidad produce conducción temeraria, mientras que la medida adecuada equilibra tiempo de llegada, seguridad, cumplimiento de normas y consumo. Las medidas de rendimiento evalúan las secuencias de estados deseables del entorno.",
 ref:"M02 L4"},

{n:127,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"aplicar",tipo:"mc",src:"propia",
 q:"Un termostato doméstico enciende la calefacción cuando la temperatura baja de cierto valor. No recuerda cuántas veces la encendió hoy, no aprende cuándo suele bajar y no anticipa el enfriamiento nocturno. Es un agente:",
 op:["Reactivo simple","Reactivo basado en modelo","Basado en objetivos","Que aprende"],
 ok:0,
 just:"Funciona exclusivamente en el presente inmediato, con reglas condición-acción sobre la percepción actual.",
 dist:"Las tres capacidades que el enunciado niega son justamente lo que agregan los tipos siguientes: memoria del entorno el basado en modelo, aprendizaje el que aprende, y anticipación del futuro el basado en objetivos. Los cinco tipos son acumulativos.",
 ref:"M02 L4"},

{n:128,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"aplicar",tipo:"mc",src:"propia",
 q:"Un robot aspirador construye un mapa interno de la casa para operar en las zonas que sus sensores no alcanzan a ver en cada momento. El tipo de agente es:",
 op:["Reactivo simple","Reactivo basado en modelo","Basado en utilidad","Que aprende"],
 ok:1,
 just:"El modelo interno rastrea lo no observable y predice estados futuros. Es el tipo que maneja entornos parcialmente observables, y esa es su capacidad decisiva.",
 dist:"El enunciado no menciona objetivos en conflicto ni mejora con la experiencia, que serían utilidad y aprendizaje. Cuando el enunciado suma observabilidad parcial más objetivos en conflicto, la respuesta que la cátedra dio por correcta fue un agente híbrido, nunca un tipo puro.",
 ref:"M02 L4"},

{n:129,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"recordar",tipo:"mc",src:"propia",
 q:"¿Cuál de los siguientes <b>no</b> es uno de los cuatro factores que determinan la racionalidad de un agente?",
 op:["La medida de rendimiento que define el éxito","El conocimiento previo del entorno","La velocidad de procesamiento de la arquitectura","La secuencia completa de percepciones hasta el momento actual"],
 ok:2,
 just:"Los cuatro son medida de rendimiento, conocimiento previo del entorno, acciones posibles y secuencia completa de percepciones.",
 dist:"La velocidad de procesamiento pertenece a la arquitectura, que es el cuerpo del agente, no a la definición de racionalidad. La ecuación es agente igual a arquitectura más programa.",
 ref:"M02 L4"},

{n:130,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"comprender",tipo:"vf",src:"propia",
 q:"Un agente racional es aquel que siempre alcanza el mejor resultado posible en su entorno.",
 op:["Verdadero","Falso"],
 ok:1,
 just:"Racionalidad no es omnisciencia. Se maximiza el rendimiento esperado, no el perfecto, y una decisión racional puede terminar mal.",
 dist:"Racional e infalible es un par que la cátedra usa para armar opciones incorrectas. Y siempre es adverbio absoluto, que en las tres instancias evaluadas marcó la opción falsa sin excepción.",
 ref:"M02 L4"},

{n:131,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"comprender",tipo:"mc",src:"propia",
 q:"La propiedad del entorno que distingue entre experiencias atómicas independientes y acciones que afectan a las decisiones futuras es:",
 op:["Observabilidad","Determinismo","Secuencialidad","Dinamismo"],
 ok:2,
 just:"Episódico contra secuencial. Clasificar piezas es episódico, conducir es secuencial.",
 dist:"Episódico y estático se confunden todo el tiempo. Episódico es que las experiencias son independientes entre sí, estático es que el entorno no cambia mientras el agente delibera. Son dos propiedades distintas de las seis.",
 ref:"M02 L4"},

/* --- Respuestas múltiples, el formato que la sección 9 no cubre --- */

{n:201,mod:"01",lec:"L1",tema:"Paradigmas y cuadrantes",nivel:"aplicar",tipo:"ms",src:"propia",
 q:"Caso del sistema de clasificación de imágenes. Marcá todas las características que aporta el enfoque de IA simbólica.",
 op:["Permite establecer umbrales y criterios de decisión predefinidos para características visuales específicas","Proporciona transparencia sobre por qué una imagen fue clasificada en determinada categoría","Exige un único árbol de decisión por categoría","Requiere procesamiento de lenguaje natural para funcionar","Necesita redes neuronales profundas"],
 ok:[0,1],
 just:"Umbrales, criterios predefinidos y trazabilidad de la decisión son los disparadores del paradigma simbólico.",
 dist:"Las tres descartadas son falsas por absolutismo, con un único, requiere y necesita. Además las redes profundas pertenecen al subsimbólico, así que la e contradice el propio enunciado. Este ítem se tomó tal cual en la actividad práctica 1.",
 ref:"M01 L1"},

{n:202,mod:"02",lec:"L4",tema:"Agentes inteligentes",nivel:"comprender",tipo:"ms",src:"propia",
 q:"Marcá todas las características de un agente basado en utilidad.",
 op:["Evalúa compensaciones entre objetivos potencialmente contradictorios","Asigna valores numéricos a los distintos estados posibles","Incorpora preferencias en la función de evaluación","Nunca modifica sus parámetros internos","Funciona solo con reglas condición-acción sobre la percepción actual"],
 ok:[0,1,2],
 just:"Las tres primeras son las que la cátedra dio por correctas, y las repitió en dos preguntas distintas del mismo trabajo práctico.",
 dist:"La e describe al reactivo simple. La d lleva nunca y la e lleva solo, los dos adverbios absolutos que marcaron la opción falsa en las tres instancias evaluadas.",
 ref:"M02 L4"},

{n:203,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"aplicar",tipo:"ms",src:"propia",
 q:"Caso del asistente médico. Marcá todas las tecnologías de PLN adecuadas para la interfaz con el paciente.",
 op:["Análisis de sentimiento para detectar preocupaciones","Extracción de entidades médicas de los textos","Modelos Transformer para consultas complejas","Reglas fijas escritas a mano para cada consulta posible"],
 ok:[0,1,2],
 just:"Son las tres que la cátedra dio por correctas en el trabajo práctico del módulo 02.",
 dist:"La d es un sistema de reglas, que no resuelve la ambigüedad ni la diversidad lingüística, dos de los seis desafíos del PLN. Escribir a mano cada consulta posible choca además con la explosión combinatoria.",
 ref:"M02 L3"},

{n:204,mod:"02",lec:"L3",tema:"Búsqueda, planificación y PLN",nivel:"comprender",tipo:"ms",src:"propia",
 q:"Caso del asistente médico. Marcá todos los elementos que debe tener un buen espacio de estados para optimizar tratamientos.",

/* ---------- Definición en castellano, por concepto ---------- */
const D_ENFOQUES=`<b>Los cuatro enfoques de Russell y Norvig</b> son cuatro respuestas distintas a la pregunta de qué debería hacer un sistema inteligente. Salen de cruzar dos preguntas. La primera: ¿lo comparamos con una persona o con lo que sería la decisión correcta? La segunda: ¿nos fijamos en cómo razona por dentro o solo en lo que hace por fuera? De ese cruce salen cuatro casillas, y la cátedra elige la de <b>actuar racionalmente</b> porque es la única que tiene una vara clara: hacer lo correcto según lo que el sistema sabe, se parezca o no a una persona.`;

const D_PARADIGMAS=`<b>Los tres paradigmas</b> se diferencian por dónde guardan lo que el sistema sabe. En el <b>simbólico</b> el conocimiento está escrito de forma que se puede leer: reglas del tipo si pasa esto, hacé aquello. Se entiende por qué decidió lo que decidió, pero se rompe ante situaciones que nadie previó. En el <b>subsimbólico</b> el conocimiento está repartido en miles de números internos que salieron de mirar datos: anda bien con casos nuevos, pero nadie puede explicar por qué. El <b>híbrido</b> usa los dos a la vez para tener potencia sin perder la explicación.`;

const D_CUADRANTES=`<b>Pensar como humano y actuar como humano no son lo mismo.</b> Pensar como humano es copiar el proceso mental, y para eso primero hay que averiguar cómo funciona la mente. Actuar como humano es que el resultado sea indistinguible del de una persona, sin importar cómo se llegó. El Test de Turing mira solo el resultado de la conversación, no lo que pasa adentro, así que pertenece a <b>actuar</b> como humano.`;

const D_AGENTE=`<b>Un agente</b> es cualquier cosa que percibe lo que pasa a su alrededor con sensores, decide, y hace algo sobre ese entorno con actuadores. La definición es amplia a propósito: entra un robot, un programa y también un ser vivo. Lo que lo distingue de un programa común es que actúa por su cuenta, percibe, sigue funcionando en el tiempo, se adapta y puede perseguir objetivos distintos.`;

const D_DEBILFUERTE=`<b>IA débil</b> es la que existe: sistemas hechos para una tarea puntual, que la hacen bien sin entender nada de lo que hacen. <b>IA fuerte</b> es la idea de una máquina que comprenda de verdad, razone y sea consciente de sí misma. Para la cátedra la fuerte es teórica, no hay un solo ejemplo funcionando.`;

const D_BIGDATA=`<b>Big data</b> no se define por un número de terabytes. Se define por una incapacidad: son datos que, por su cantidad, su velocidad o su diversidad de formatos, <b>ya no se pueden manejar con las herramientas de siempre</b>. La definición nombra cuatro cosas que hay que poder hacer con ellos: almacenar, procesar, analizar y visualizar. La visualización es la que se olvida.`;

const D_VARIEDAD=`<b>Los tres tipos de dato</b> se separan por cuánta estructura traen. <b>Estructurado</b> es lo que entra prolijo en una tabla, con columnas definidas. <b>No estructurado</b> es lo que no tiene forma fija: una foto, un audio, un posteo. <b>Semiestructurado</b> es el intermedio: tiene algunos campos fijos y otra parte libre, como un correo, que trae remitente y asunto bien definidos pero un cuerpo donde se escribe cualquier cosa.`;

const D_CINCOV=`<b>Las cinco V</b> son las cinco dimensiones por las que unos datos se vuelven difíciles de manejar. <b>Volumen</b> es cuántos son. <b>Velocidad</b> es qué tan rápido llegan. <b>Variedad</b> es de cuántas formas distintas vienen. <b>Veracidad</b> es qué tan confiables son. <b>Valor</b> es qué se puede sacar de ellos. Las tres primeras son las originales de 2001 y apuntan a problemas técnicos; las dos últimas se agregaron después y apuntan a la calidad y al provecho.`;

const D_APRENDIZAJE=`<b>Los tres tipos de aprendizaje</b> se separan por qué información recibe el sistema. En el <b>supervisado</b> le mostrás ejemplos ya resueltos, con la respuesta correcta al lado, y aprende a responder casos nuevos. En el <b>no supervisado</b> no hay respuestas: le das los datos crudos y él solo encuentra grupos o cosas raras que nadie le pidió buscar. En el <b>por refuerzo</b> no hay ejemplos previos: prueba, mira si le fue bien o mal, y ajusta.`;

const D_DEEP=`<b>El aprendizaje profundo</b> es una red neuronal con muchas capas intermedias. Eso es todo: la definición es estructural. Tener muchos datos o usar placas de video potentes no es lo que lo define, son las condiciones que lo hicieron posible. Lo que ganan las capas de más es que cada una arma conceptos más complejos a partir de la anterior.`;

const D_GENERATIVA=`<b>La IA generativa</b> crea contenido nuevo: texto, imágenes, audio que antes no existían. La IA tradicional no crea, decide sobre lo que ya está: clasifica, encuentra patrones, predice. Es la diferencia entre escribir un párrafo y decir si un párrafo es spam.`;

const D_CRONORED=`<b>La historia de las redes neuronales</b> tiene cuatro momentos. En 1943 McCulloch y Pitts proponen la idea en papel, un modelo matemático de neurona. En 1958 Rosenblatt construye el perceptrón, la primera que aprende de ejemplos. En los ochenta llega la retropropagación, que permite entrenar redes de varias capas. Y en la década de 2010 explota el aprendizaje profundo.`;

const D_TAREASVISION=`<b>Las tres tareas de visión</b> responden preguntas distintas. <b>Clasificar</b> responde qué hay en esta imagen, con un solo objeto y una lista de categorías cerrada. <b>Detectar y localizar</b> responde qué hay y dónde está cada cosa, con varios objetos en la misma imagen. <b>Crear</b> no responde nada: genera una imagen nueva.`;

const D_PIXEL=`<b>Una imagen digital es una tabla de números.</b> Cada casillero es un píxel. En escala de grises cada píxel guarda un número de 0 a 255 que dice cuánta luz tiene: 0 es negro absoluto, 255 es blanco puro y 128 es el gris del medio. En color cada píxel guarda tres números, uno por cada color primario de la luz.`;

const D_FACIAL=`<b>Los dos modos de reconocimiento facial</b> responden preguntas distintas. <b>Identificar</b> es preguntar quién es esta persona, y para eso hay que comparar la cara contra toda una base: uno contra muchos. <b>Verificar</b> es preguntar si es quien dice ser, y ahí se compara contra una sola foto: uno contra uno. Identificar cuesta mucho más porque hace muchísimas más comparaciones.`;

const D_EXTREMO=`<b>Aprendizaje de extremo a extremo</b> significa que el sistema aprende todo junto, desde la imagen cruda hasta la respuesta final, en una sola pieza. En el enfoque tradicional una persona decidía a mano qué características mirar y después otro programa clasificaba con eso. Acá las dos cosas se aprenden y se ajustan juntas.`;

const D_LOGICA=`<b>La lógica formal</b> es escribir razonamientos con símbolos, para poder verificarlos como se verifica una cuenta. Boole dio el primer paso con las operaciones y, o y no. Frege dio el siguiente: introdujo <b>variables</b>, para hablar de un elemento cualquiera, y <b>cuantificadores</b>, para decir para todos o existe al menos uno. Sin eso no se puede escribir todos los humanos son mortales.`;

const D_PARADA=`<b>El problema de la parada</b> pregunta si se puede escribir un programa que, mirando cualquier otro programa, diga con certeza si va a terminar o si va a quedar colgado para siempre. Turing probó que <b>no existe</b>, y no porque sea difícil o lento: probó que es imposible, sin importar cuánta computadora tengas. Es un límite de la lógica, no del hardware.`;

const D_SIMON=`<b>Racionalidad limitada</b> es la idea de que ni las personas ni las máquinas pueden analizar todas las opciones antes de decidir, porque no alcanza ni el tiempo ni la cabeza. Entonces se busca una solución <b>lo bastante buena</b> en vez de la óptima. No es una excusa por falta de recursos: es un criterio de diseño, y es lo que justifica usar heurísticas.`;

const D_NEURONA=`<b>La neurona artificial</b> es un modelo matemático muy simple de lo que hace una neurona real: recibe varias señales, las pesa, y si la suma pasa cierto umbral se activa. McCulloch y Pitts lo describieron en 1943 y mostraron que con eso alcanza para hacer operaciones lógicas básicas.`;

const D_DARTMOUTH=`<b>La conferencia de Dartmouth de 1956</b> es el momento en que la inteligencia artificial se convierte en una disciplina con nombre propio. La organizó John McCarthy, que fue quien inventó el término. Antes había trabajos sueltos, incluido el test que Turing publicó en 1950, pero el campo como tal nace ahí.`;

const D_PERCEPTRONS=`<b>El libro <i>Perceptrons</i>, de 1969,</b> mostró que una red de <b>una sola capa</b> no puede resolver problemas donde las categorías no se separan con una línea recta. El caso clásico es la función XOR. El resultado era correcto pero acotado, y se leyó como si condenara a todas las redes: eso ayudó a frenar la investigación durante años. La retropropagación de 1986 resolvió el caso de varias capas.`;

const D_ALEXNET=`<b>AlexNet</b> es la red que en 2012 ganó la competencia de reconocimiento de imágenes ImageNet por una diferencia enorme y arrancó la era del aprendizaje profundo. No la explica un solo invento sino tres cosas que coincidieron: una mejora en cómo se activan las neuronas, el uso de placas de video para entrenar mucho más rápido, y la existencia de bases enormes de imágenes ya etiquetadas.`;

const D_ESPACIOESTADOS=`<b>El espacio de estados</b> es el mapa de todas las situaciones posibles por las que puede pasar un problema mientras se lo resuelve. Cada situación completa es un <b>estado</b>, cada movimiento que te lleva de una a otra es un <b>operador</b>. Se dibuja como un grafo: los estados son puntos y los movimientos son las líneas que los unen. Ojo con la palabra estado: acá es la foto completa del problema en un momento, no un registro ni un checkpoint.`;

const D_BUSQUEDA=`<b>Búsqueda informada y no informada</b> se diferencian por si el algoritmo tiene una pista de hacia dónde queda el objetivo. La <b>no informada</b> avanza a ciegas, mirando solo lo que ya recorrió: cuánto costó llegar hasta acá. La <b>informada</b> además estima cuánto falta, y esa estimación se llama heurística. Ojo: llevar la cuenta de lo ya gastado no es tener una pista, así que costo uniforme sigue siendo a ciegas.`;

const D_ASTAR=`<b>A*</b> combina las dos cosas: cuánto costó llegar hasta acá más cuánto se estima que falta. Encuentra el mejor camino, pero <b>solo si la estimación nunca es más optimista de la cuenta</b>, es decir si nunca dice que falta más de lo que realmente falta. Eso se llama heurística admisible. Si la estimación exagera, A* puede descartar el buen camino antes de mirarlo.`;

const D_RAZONAMIENTOS=`<b>Los tres razonamientos</b> van en direcciones distintas. El <b>deductivo</b> baja de una regla general a un caso concreto y la conclusión es segura. El <b>inductivo</b> sube de varios casos a una regla general, y puede fallar. El <b>abductivo</b> parte de un hecho puntual y propone la causa más plausible: es la hipótesis del médico o del que debuggea, y hay que salir a verificarla.`;

const D_PLN=`<b>Los cinco niveles del procesamiento del lenguaje</b> van de la forma al sentido. Primero se corta el texto en pedazos, después se mira la forma de cada palabra, después cómo se arma la oración, después qué significa, y por último qué quiso decir el que habló según el contexto. Los dos últimos se confunden: el <b>semántico</b> es qué dice la frase, el <b>pragmático</b> es qué quiso decir esta persona en esta situación.`;

const D_ENTORNO=`<b>Las seis propiedades del entorno</b> son la ficha técnica del lugar donde trabaja el agente, y sirven para saber qué tan complicado va a ser diseñarlo. Se pregunta si ve todo o solo una parte, si está solo o hay otros, si sus acciones tienen efecto seguro, si lo que hace ahora afecta lo que viene, si el mundo cambia mientras piensa, y si los valores son contables o continuos.`;

const D_TIPOSAGENTE=`<b>Los cinco tipos de agente</b> son una escalera, cada uno suma algo al anterior. El <b>reactivo simple</b> solo reacciona a lo que ve ahora, sin memoria. El <b>basado en modelo</b> agrega memoria del mundo, y por eso puede trabajar donde no ve todo. El <b>basado en objetivos</b> agrega una meta y planifica para llegar. El <b>basado en utilidad</b> agrega un puntaje para elegir cuando hay objetivos que se contradicen. El <b>que aprende</b> agrega mejorar solo con la experiencia.`;

const D_FUNPROG=`<b>La función de agente y el programa de agente</b> no son lo mismo. La <b>función</b> es la tabla ideal y completa que dice, para cualquier historia de percepciones posible, qué habría que hacer. Es un objeto teórico, normalmente infinito. El <b>programa</b> es el código concreto que corre en la máquina y aproxima esa tabla. Uno es el plano, el otro es la construcción.`;

const D_PEAS=`<b>PEAS</b> es la ficha con la que se describe un agente antes de diseñarlo. Son cuatro preguntas: qué significa que le vaya bien, dónde trabaja, con qué actúa y con qué percibe. Los <b>sensores</b> son por donde entra la información y los <b>actuadores</b> son por donde sale la acción. Sin actuadores el agente percibe y decide pero no hace nada.`;

const D_RENDIMIENTO=`<b>La medida de rendimiento</b> es la definición de qué significa que al agente le vaya bien, y se juzga por cómo queda el entorno, no por lo que el agente hizo. Está mal formulada cuando premiar el número elegido lleva a un comportamiento absurdo: si al sistema de riego le pagás por litro distribuido, va a inundar el campo.`;
