  }

  const cab = modo==="quiz"
    ? 'Módulo '+p.mod+' · '+p.lec+' · '+p.tema+' · nivel '+p.nivel
    : p.inst+' · pregunta '+p.orig+' · '+p.tema;

  esc.innerHTML=
   '<div class="tarjeta">'+
     '<div class="metaFila"><div class="meta">'+cab+
       ' · <span class="origen '+ORIGEN(p)+'">'+ROTULO[ORIGEN(p)]+'</span></div>'+
       '<button class="flag" id="flag"></button></div>'+
     '<p class="enunciado">'+p.q+'</p>'+
     cuerpo+
     '<div class="feedback" id="fb"></div>'+
   '</div>';

  const bf=$("flag");
  pintarFlag(bf,p.n);
  bf.onclick=()=>alternarFlag(p.n,bf);

  if(p.tipo==="ms"){
    esc.querySelectorAll(".opcion").forEach(b=>b.onclick=()=>{
      const on=b.getAttribute("aria-pressed")!=="true";
      b.setAttribute("aria-pressed",on);
      b.classList.toggle("elegida",on);
    });
    $("chk").onclick=()=>responder(p,[...esc.querySelectorAll('.opcion.elegida')].map(b=>+b.dataset.k));
  } else if(p.tipo==="mc"||p.tipo==="vf"){
    esc.querySelectorAll(".opcion").forEach(b=>b.onclick=()=>responder(p,+b.dataset.k));
  } else {
    const go=()=>{
      let ok=p.acepta.map(norm).includes(norm($("in1").value));
      if(p.tipo==="texto2") ok = ok && p.acepta2.map(norm).includes(norm($("in2").value));
      responder(p, ok?"OK":"NO");
    };
    $("chk").onclick=go;
    $("in1").onkeydown=e=>{if(e.key==="Enter")go()};
    if($("in2")) $("in2").onkeydown=e=>{if(e.key==="Enter")go()};
    $("in1").focus({preventScroll:true});
  }
}

function responder(p,elegido){
  const bien = p.tipo==="ms"
      ? (elegido.length===p.ok.length && elegido.every(k=>p.ok.includes(k)))
      : (p.tipo==="mc"||p.tipo==="vf") ? elegido===p.ok : elegido==="OK";
  if(bien) aciertos++;
  resultados.push({p:p,bien:bien});
  marcar(p.n,bien);
  pintarChips();

  if(p.tipo==="ms"){
    $("chk").disabled=true;
    esc.querySelectorAll(".opcion").forEach((b,k)=>{
      b.disabled=true;
      const era=p.ok.includes(k), marc=elegido.includes(k);
      b.classList.remove("elegida");
      if(era&&marc) b.classList.add("correcta");
      else if(era&&!marc) b.classList.add("faltante");
      else if(!era&&marc) b.classList.add("incorrecta");
    });
  } else if(p.tipo==="mc"||p.tipo==="vf"){
    esc.querySelectorAll(".opcion").forEach((b,k)=>{
      b.disabled=true;
      if(k===p.ok) b.classList.add("correcta");
      else if(k===elegido) b.classList.add("incorrecta");
    });
  } else {
    esc.querySelectorAll("input").forEach(x=>x.disabled=true);
    $("chk").disabled=true;
  }

  const correcta = (p.tipo==="ms") ? p.ok.map(k=>"abcde"[k]).join(", ")+
                     ". Las de borde punteado son las que te faltaron"
                 : (p.tipo==="mc") ? "abcde"[p.ok]+") "+p.op[p.ok]
                 : (p.tipo==="vf") ? p.op[p.ok]
                 : p.sol;

  $("fb").innerHTML=
    '<div class="veredicto '+(bien?"bien":"mal")+'">'+(bien?"Correcta":"Incorrecta")+'</div>'+
    (bien?"":'<p class="respuesta">La respuesta correcta es <strong>'+correcta+'</strong></p>')+
    (DEF[p.n]?'<div class="bloque endef"><span class="rot">En palabras</span>'+DEF[p.n]+'</div>':'')+
    '<p class="bloque"><span class="rot">Por qué</span>'+p.just+'</p>'+
    '<p class="bloque"><span class="rot">El distractor</span>'+p.dist+'</p>'+
    (AMP[p.n]?'<div class="bloque amp"><span class="rot">Teoría completa</span>'+AMP[p.n]+'</div>':'')+
    '<div class="pie"><span class="ref">Referencia: '+p.ref+'</span>'+
    '<button class="btn" id="sig">'+(i===lista.length-1?"Ver resultado":"Siguiente")+'</button></div>';
  $("fb").classList.add("visible");
  $("sig").onclick=()=>{i++;render()};
  $("sig").focus({preventScroll:true});

  const fl=$("flot");
  fl.innerHTML='<b>&#8594;</b><span>'+(i===lista.length-1?"Ver resultado":"Siguiente")+
    '</span><small>Enter</small>';
  fl.onclick=()=>{i++;render()};
  fl.classList.add("visible");

  cabecera();
}

function resumen(){
  $("flot").classList.remove("visible");
  $("barra").style.width="100%";
  const fallos=resultados.filter(r=>!r.bien);
  const sinMarcar=[...new Set(fallos.map(r=>r.p.n))].filter(n=>!flags[n]);
  const porTema={};
  resultados.forEach(r=>{
    const k = modo==="quiz" ? "M"+r.p.mod+" "+r.p.lec+" · "+r.p.tema : r.p.inst+" · "+r.p.tema;
    porTema[k]=porTema[k]||{ok:0,tot:0};
    porTema[k].tot++; if(r.bien) porTema[k].ok++;
  });
  const filas=Object.entries(porTema).map(([k,v])=>{
    const flojo=v.ok/v.tot<0.75;
    return '<tr><td'+(flojo?' class="flojo"':'')+'>'+k+'</td><td class="n">'+v.ok+' / '+v.tot+'</td>'+
           '<td class="n">'+(flojo?'<span class="flojo">Volver</span>':'Firme')+'</td></tr>';
  }).join("");

  const tot=resultados.length, base=BANCO();
  const puntos=Math.round(aciertos/tot*100);
  const completa=tot===base.length;
  const nota = puntos>=90?"Listo para rendir"
             : puntos>=75?"Aprobado, con temas para reforzar"
             : puntos>=60?"Justo. Conviene otra vuelta antes del parcial"
             : "Insuficiente. Volver a la teoría antes de repetir";
  const detalle = modo==="quiz"
    ? 'Las '+base.length+' preguntas del banco: las '+base.filter(q=>ORIGEN(q)==="paquete").length+
      ' de la sección 9 del paquete más las '+base.filter(q=>ORIGEN(q)==="propia").length+
      ' escritas sobre el material.'
    : modo==="preg"
    ? 'Las '+base.length+' preguntas rescatadas de pregunteros de circulación libre, filtradas y verificadas contra tu material. Solo entraron las que aportan algo que el banco de estudio no cubría.'
    : 'Las '+base.length+' preguntas que la cátedra ya te tomó este período. El enunciado y la respuesta correcta salen del registro de cada trabajo práctico; parte de las opciones están reconstruidas y cada pregunta lo aclara.';

  esc.innerHTML=
   '<div class="resumen">'+
     '<h2>'+(completa?'Evaluación completa':'Resultado parcial')+'</h2>'+
     '<div class="puntaje">'+puntos+' / 100</div>'+
     '<p class="ui" style="color:var(--tenue);font-size:14px;margin:0">'+aciertos+' de '+tot+' correctas</p>'+
     '<div class="nota100"><b>'+nota+'</b><br>'+
       (completa?detalle:'Corriste '+tot+' de las '+base.length+' preguntas de este banco. Para el puntaje comparable hay que hacer la corrida completa, con el filtro en Todo.')+
     '</div>'+
     (marcadas().length?'<p class="ui" style="font-size:13.5px;color:#7A5A22;margin:14px 0 0">'+
       '⚑ Te quedan '+marcadas().length+' preguntas con bandera en este banco. Están en el índice, bajo Marcadas para repasar.</p>':'')+
     '<table><thead><tr><th>'+(modo==="quiz"?"Lección":"Trabajo práctico")+'</th><th class="n">Aciertos</th><th class="n">Estado</th></tr></thead>'+
     '<tbody>'+filas+'</tbody></table>'+
     '<p class="ui" style="font-size:13.5px;color:var(--tenue)">Se marca como flojo todo lo que baje del 75 por ciento.</p>'+
     '<div class="pie">'+
       '<button class="btn sec" id="rep">Repetir todo</button>'+
       '<span class="accionesFin">'+
         (fallos.length?'<button class="btn sec" id="marcarFallos"'+(sinMarcar.length?'':' disabled')+'>'+
           (sinMarcar.length?'⚑ Marcar las '+sinMarcar.length+' que fallé':'⚑ Ya están todas marcadas')+'</button>':'')+
         (fallos.length?'<button class="btn" id="solo">Repasar ahora las '+fallos.length+'</button>':'')+
       '</span>'+
     '</div>'+
   '</div>';
  $("rep").onclick=()=>{i=0;aciertos=0;resultados=[];render()};
  if(fallos.length){
    $("solo").onclick=()=>{lista=fallos.map(f=>f.p);i=0;aciertos=0;resultados=[];render()};
    const bm=$("marcarFallos");
    if(sinMarcar.length) bm.onclick=()=>{
      sinMarcar.forEach(n=>flags[n]=1);
      guardarFlags();
      bm.disabled=true;
      bm.textContent="⚑ Listo, quedaron "+sinMarcar.length+" marcadas";
      pintarChips();
    };
  }
}

/* ---------- Panel ---------- */
const panel=$("panel"), fondo=$("fondo"), btnAbrir=$("abrir"), btnFijar=$("fijar");

/* El menú solo puede quedar anclado al costado si hay ancho de sobra. Por debajo
   de 1024 px siempre se comporta como cajón: se abre encima y se puede cerrar. */
const ANCHO_ANCLABLE=window.matchMedia("(min-width:1025px)");
function anclable(){return ANCHO_ANCLABLE.matches}
function anclado(){return fijo && anclable()}

let fijo=true;
try{const g=localStorage.getItem(PKEY); if(g!==null) fijo=(g==="1");}catch(e){}

function pintarFijar(){
  btnFijar.setAttribute("aria-pressed",fijo);
  btnFijar.innerHTML='<b>'+(fijo?"◀":"▶")+'</b>'+(fijo?"Soltar":"Fijar");
  btnFijar.title=fijo?"El menú deja de estar fijo y vuelve a abrirse solo cuando lo pedís"
                     :"Dejar el menú siempre a la vista, al costado de las preguntas";
}
function pintarBurger(){
  const abierto=panel.classList.contains("abierto") && !anclado();
  btnAbrir.setAttribute("aria-expanded",abierto?"true":"false");
  btnAbrir.title=abierto?"Ocultar el índice de temas":"Ver el índice de temas";
}
/* Con el cajón abierto en pantallas chicas, el fondo no debe seguir haciendo scroll. */
function trabarScroll(){
  document.body.classList.toggle("sinScroll",
    panel.classList.contains("abierto") && !anclable());
}
function aplicarFijo(guardar){
  document.body.classList.toggle("fijo",fijo);
  if(anclado()){panel.classList.add("abierto");fondo.classList.remove("abierto")}
  else{panel.classList.remove("abierto");fondo.classList.remove("abierto")}
  pintarFijar();pintarBurger();trabarScroll();
  if(guardar){try{localStorage.setItem(PKEY,fijo?"1":"0")}catch(e){}}
}
function abrirPanel(){
  panel.classList.add("abierto");
  if(!anclado())fondo.classList.add("abierto");
  pintarBurger();trabarScroll();
}
function cerrarPanel(){
  if(anclado()) return;
  panel.classList.remove("abierto");fondo.classList.remove("abierto");
  pintarBurger();trabarScroll();
}
function alternarPanel(){
  if(panel.classList.contains("abierto")) cerrarPanel(); else abrirPanel();
}

btnAbrir.onclick=alternarPanel;
btnFijar.onclick=()=>{fijo=!fijo;aplicarFijo(true)};
$("cerrar").onclick=()=>{if(anclable()){fijo=false;aplicarFijo(true)}else cerrarPanel()};
fondo.onclick=cerrarPanel;
/* Al cruzar el punto de corte, el menú se reacomoda en vez de quedar a medio camino. */
const alCambiarAncho=()=>aplicarFijo(false);
if(ANCHO_ANCLABLE.addEventListener) ANCHO_ANCLABLE.addEventListener("change",alCambiarAncho);
else if(ANCHO_ANCLABLE.addListener) ANCHO_ANCLABLE.addListener(alCambiarAncho);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){cerrarPanel();return}
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if((e.key==="Enter"||e.key==="ArrowRight") && $("flot").classList.contains("visible")){
    e.preventDefault(); $("flot").click();
  }
});
aplicarFijo(false);

document.querySelectorAll(".modo").forEach(b=>{
  b.onclick=()=>{
    modo=b.dataset.modo;filtro="todo";
    document.querySelectorAll(".modo").forEach(x=>x.setAttribute("aria-pressed",x===b));
    aplicar();cerrarPanel();
  };
});
aplicar();

</script>
